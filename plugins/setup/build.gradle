import org.opensearch.gradle.test.RestIntegTestTask
import org.opensearch.gradle.testclusters.StandaloneRestIntegTestTask

import java.util.concurrent.Callable

buildscript {
  ext {
    opensearch_version = System.getProperty("opensearch.version", "3.6.0-SNAPSHOT")
    opensearch_build = opensearch_version.replace("-SNAPSHOT", "") + ".0"
    wazuh_version = System.getProperty("version") ?: new groovy.json.JsonSlurper()
        .parse(new File(projectDir, "../../VERSION.json")).version
    revision = System.getProperty("revision", "0")
  }

  repositories {
    mavenLocal()
    maven { url "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    mavenCentral()
    maven { url "https://plugins.gradle.org/m2/" }
  }

  dependencies {
    classpath "org.opensearch.gradle:build-tools:${opensearch_version}"
  }
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'
apply plugin: 'opensearch.opensearchplugin'
apply plugin: 'opensearch.testclusters'
apply plugin: 'opensearch.java-rest-test'
apply plugin: 'opensearch.pluginzip'
apply plugin: 'opensearch.java-agent'

def pluginName = 'wazuh-indexer-setup'
def pluginDescription = 'Wazuh Indexer setup plugin'
def projectPath = 'com.wazuh'
def pathToPlugin = 'setup'
def pluginClassName = 'SetupPlugin'

publishing {
  publications {
    pluginZip(MavenPublication) { publication ->
      pom {
        name = pluginName
        description = pluginDescription
        licenses {
          license {
            name = "GNU Affero General Public License (AGPL) version 3.0"
            url = "http://www.gnu.org/licenses/agpl-3.0.txt"
          }
        }
        developers {
          developer {
            name = "Wazuh"
            url = "https://wazuh.com"
          }
        }
      }
    }
  }
}

allprojects {
  group = "${projectPath}"
  version = "${wazuh_version}" + ".${revision}"
}

opensearchplugin {
  name pluginName
  description pluginDescription
  classname "${projectPath}.${pathToPlugin}.${pluginClassName}"
  extendedPlugins = ['opensearch-index-management']
  licenseFile rootProject.file('LICENSE.txt')
  noticeFile rootProject.file('NOTICE.txt')
}

configurations {
  zipArchive
}

// The Index Management plugin, which this plugin extends, publishes its classes only inside its
// zip. Its policy parser checks the policy files of the configuration directory, so the jars the
// parser needs are taken out of the zip. They are not bundled: on a node, the classes come from
// the extended plugin.
def indexManagementJarsDir = layout.buildDirectory.dir('index-management-jars')
def extractIndexManagementJars = tasks.register('extractIndexManagementJars', Sync) {
  description = 'Take the jars of the Index Management policy parser out of the plugin zip'
  from({ zipTree(getPlugin('opensearch-index-management').get().asFile) }) {
    include 'opensearch-index-management-*.jar'
    include 'kotlin-stdlib-?.*.jar'
  }
  into indexManagementJarsDir
}
def indexManagementJars = fileTree(indexManagementJarsDir) {
  include '*.jar'
  builtBy extractIndexManagementJars
}

dependencies {
  runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:2.25.4"
  implementation "org.slf4j:slf4j-api:2.0.17"

  // Use Jackson provided by OpenSearch (2.21.2) - only for compile time
  compileOnly 'com.fasterxml.jackson.core:jackson-core:2.21.2'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.2'
  implementation 'com.fasterxml.jackson.core:jackson-annotations:2.21'

  // Job Scheduler & ISM stuff (required for the initialization of ISM policies)
  zipArchive group: 'org.opensearch.plugin', name: 'opensearch-job-scheduler', version: opensearch_build
  zipArchive group: 'org.opensearch.plugin', name: 'opensearch-index-management', version: opensearch_build
  compileOnly "org.opensearch:opensearch-job-scheduler-spi:${opensearch_build}"
  compileOnly indexManagementJars
  testImplementation indexManagementJars

  // Provides the zstd/zstd_no_dict index codecs used in index templates
  zipArchive group: 'org.opensearch.plugin', name: 'opensearch-custom-codecs', version: opensearch_build
}

// No need to validate license headers since spotless checks and applies it
licenseHeaders.enabled = false

// This requires an additional Jar not published as part of build-tools
loggerUsageCheck.enabled = false

// No need to validate pom, as we do not upload to maven/sonatype
validateNebulaPom.enabled = false

//Skip checking for third party licenses
dependencyLicenses.enabled = false

repositories {
  mavenLocal()
  maven { url "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
  mavenCentral()
  maven { url "https://plugins.gradle.org/m2/" }
}

test {
  include '**/*Tests.class'
}

// The threat-intel content index mappings exist twice on purpose: this plugin ships them as
// index templates (templates/content/*.json) and the Content Manager keeps its own copies
// (mappings/cti-*-mappings.json) so it can still create the blue/green shadow indices and
// run standalone. Both copies must describe the same index, so compare them at build time
// rather than discovering the drift in production. See issue #1476.
task verifyContentTemplates {
  description = "Assert the content index templates match the Content Manager's mappings"
  group = "verification"

  // Resolved relative to this project, so it works both in the root multi-project build and in the
  // standalone `cd plugins/setup && ./gradlew check` build CI runs.
  def templatesDir = file("src/main/resources/templates/content")
  def mappingsDir = file("../content-manager/src/main/resources/mappings")
  def pairs = [
    "ioc.json"            : "cti-ioc-mappings.json",
    "filters.json"        : "cti-filters-mappings.json",
    "decoders.json"       : "cti-decoders-mappings.json",
    "rules.json"          : "cti-rules-mappings.json",
    "kvdbs.json"          : "cti-kvdbs-mappings.json",
    "integrations.json"   : "cti-integrations-mappings.json",
    "policies.json"       : "cti-policies-mappings.json",
    "vulnerabilities.json": "cti-cve-mappings.json",
  ]

  inputs.dir(templatesDir)
  outputs.upToDateWhen { false }

  doLast {
    // A checkout without the sibling plugin has nothing to compare against.
    if (!mappingsDir.isDirectory()) {
      logger.lifecycle("Skipping: the Content Manager mappings are not present at ${mappingsDir}")
      return
    }
    def slurper = new groovy.json.JsonSlurper()
    def problems = []
    pairs.each { template, mapping ->
      def templateFile = new File(templatesDir, template)
      def mappingFile = new File(mappingsDir, mapping)
      if (!templateFile.exists()) {
        problems << "missing index template: ${templateFile}"
        return
      }
      if (!mappingFile.exists()) {
        problems << "missing Content Manager mapping: ${mappingFile}"
        return
      }
      def templated = slurper.parse(templateFile).template.mappings
      def mapped = slurper.parse(mappingFile)
      if (templated != mapped) {
        problems << "${template} and ${mapping} describe different mappings"
      }
    }
    if (!problems.isEmpty()) {
      throw new GradleException("Content index template verification failed:\n  - " + problems.join("\n  - "))
    }
  }
}
tasks.named("check").configure { dependsOn(verifyContentTemplates) }

def getPlugin(pluginName) {
  provider(new Callable<RegularFile>() {
    @Override
    RegularFile call() throws Exception {
      return new RegularFile() {
        @Override
        File getAsFile() {
          return configurations.zipArchive.asFileTree.matching {
            include String.format("**/%s*", pluginName)
          }.singleFile
        }
      }
    }
  })
}

task integTest(type: RestIntegTestTask) {
  description = "Run tests against a cluster"
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  // The tests of the configuration file run on clusters started with that file
  exclude '**/SetupConfig*IT.class'
}
tasks.named("check").configure { dependsOn(integTest) }

// Integration tests of the configuration file (setup.yml). The plugin reads the file when it
// initializes the cluster, so each case needs a cluster that starts with its own file. The files of
// a case are in src/test/resources/setup-config/<case>. They are staged in the build directory,
// which is where the clusters take them from, so that a second phase can replace them.
def setupConfigFixtures = file('src/test/resources/setup-config')
def setupConfigStaging = layout.buildDirectory.dir('setup-config-it').get().asFile
def setupConfigIntegTests = [
  overridesIntegTest    : [tests: 'SetupConfigOverridesIT', files: 'overrides'],
  invalidConfigIntegTest: [tests: 'SetupConfigInvalidIT', files: 'invalid'],
  invalidPolicyIntegTest: [tests: 'SetupConfigInvalidIT', files: 'invalid-policy'],
]
setupConfigIntegTests.each { taskName, testCase ->
  def stage = tasks.register("${taskName}Config", Sync) {
    description = "Stage the configuration files of ${taskName}"
    from new File(setupConfigFixtures, testCase.files)
    into new File(setupConfigStaging, testCase.files)
    // The second phase overwrites a staged file, and that change is not always seen as one.
    outputs.upToDateWhen { false }
  }
  tasks.register(taskName, RestIntegTestTask) {
    description = "Run ${testCase.tests} against a cluster configured with setup-config/${testCase.files}"
    dependsOn stage
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    setIncludes(["**/${testCase.tests}.class"])
  }
  tasks.named("check").configure { dependsOn(taskName) }
}

// Second phase of overridesIntegTest, on the same cluster: setup.yml is replaced by the one of
// setup-config/restored, where the policy switches are back to false, and the cluster restarts.
// The plugin initializes the cluster again with the new file, on top of what the first phase left.
tasks.register('restoredDefaultsIntegTest', StandaloneRestIntegTestTask) {
  description = "Run SetupConfigRestoredIT against the cluster of overridesIntegTest, restarted with setup-config/restored"
  dependsOn 'overridesIntegTest'
  useCluster testClusters.overridesIntegTest
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/SetupConfigRestoredIT.class'
  systemProperty 'tests.rest.load_packaged', 'false'
  doFirst {
    copy {
      from new File(setupConfigFixtures, 'restored')
      into new File(setupConfigStaging, 'overrides')
    }
    // The cluster's own restart() installs the plugins again, which fails while they are installed.
    testClusters.overridesIntegTest.nodes.each { node ->
      node.stop(false)
      delete node.distroDir.resolve('plugins').toFile().listFiles()
      node.start()
    }
  }
  nonInputProperties.systemProperty('tests.rest.cluster', "${-> testClusters.overridesIntegTest.allHttpSocketURI.join(",")}")
  nonInputProperties.systemProperty('tests.cluster', "${-> testClusters.overridesIntegTest.allTransportPortURI.join(",")}")
  nonInputProperties.systemProperty('tests.clustername', "${-> testClusters.overridesIntegTest.getName()}")
}
tasks.named("check").configure { dependsOn('restoredDefaultsIntegTest') }

integTest {
  // The --debug-jvm command-line option makes the cluster debuggable; this makes the tests debuggable
  if (System.getProperty("test.debug") != null) {
    jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005'
  }
}

testClusters {
  integTest {
    plugin(getPlugin("opensearch-job-scheduler"))
    plugin(getPlugin("opensearch-index-management"))
    plugin(getPlugin("opensearch-custom-codecs"))

    testDistribution = "INTEG_TEST"

    // This installs our plugin into the testClusters
    plugin(project.tasks.bundlePlugin.archiveFile)

    // The --debug-jvm command-line option makes the cluster debuggable; this makes the tests debuggable
    if (System.getProperty("cluster.debug") != null) {
      jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005'
    }
  }

  setupConfigIntegTests.each { taskName, testCase ->
    "${taskName}" {
      plugin(getPlugin("opensearch-job-scheduler"))
      plugin(getPlugin("opensearch-index-management"))
      plugin(getPlugin("opensearch-custom-codecs"))

      testDistribution = "INTEG_TEST"

      plugin(project.tasks.bundlePlugin.archiveFile)

      // Copied before the plugins are installed. The installer keeps the files that exist, and adds
      // the rest of the plugin configuration directory next to them.
      new File(setupConfigFixtures, testCase.files).listFiles().each { configFile ->
        extraConfigFile "wazuh-indexer-setup/${configFile.name}",
            new File(setupConfigStaging, "${testCase.files}/${configFile.name}")
      }
    }
  }

  runCluster {
    plugin(getPlugin("opensearch-job-scheduler"))
    plugin(getPlugin("opensearch-index-management"))
    plugin(getPlugin("opensearch-custom-codecs"))

    testDistribution = "ARCHIVE"

    plugin(project.tasks.bundlePlugin.archiveFile)

    if (System.getProperty("run.cluster.debug") != null) {
      jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005'
    }
  }
}


run {
  useCluster testClusters.runCluster
}

afterEvaluate {
    if (tasks.findByName('publishNebulaPublicationToMavenLocal') && tasks.findByName('generatePomFileForPluginZipPublication')) {
        tasks.named('publishNebulaPublicationToMavenLocal').configure {
            dependsOn tasks.named('generatePomFileForPluginZipPublication')
        }
    }
}

// updateVersion: Task to auto update version to the next development iteration
task updateVersion {
  onlyIf { System.getProperty('newVersion') }
  doLast {
    ext.newVersion = System.getProperty('newVersion')
    println "Setting version to ${newVersion}."
    // String tokenization to support -SNAPSHOT
    ant.replaceregexp(file: 'build.gradle', match: '"opensearch.version", "\\d.*"', replace: '"opensearch.version", "' + newVersion.tokenize('-')[0] + '-SNAPSHOT"', flags: 'g', byline: true)
  }
}

// Code coverage (JaCoCo): reports, and integTest cluster coverage with -Dtests.coverage=true.
apply from: file("../../gradle/coverage.gradle")

// Files of the plugin configuration directory (setup.yml, ISM policy copies, README).
apply from: file("gradle/setup-config.gradle")
