openapi: 3.0.0
info:
  title: Indexer Setup API
  description: |
    API for the Wazuh Indexer Setup plugin.
    This API enables management of Wazuh platform settings such as Engine configuration.
  version: 1.0.0
  license:
    name: AGPL 3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: "{protocol}://{wazuh.indexer}:{port}/_plugins/_setup"
    description: Wazuh Indexer Setup Plugin
    variables:
      protocol:
        enum:
          - "http"
          - "https"
        default: "https"
      wazuh.indexer:
        default: localhost
      port:
        default: "9200"

tags:
  - name: Settings
    description: Operations for managing Wazuh platform settings
  - name: AI Assistant
    description: |
      Operations for managing the AI assistant's providers, global settings and field policy.
      These are stored, along with the CTI access token, in the hidden system index
      `.wazuh-internal-state`, which is unreachable through ordinary index permissions; these
      endpoints are the only way to read or write that data.
  - name: AI Assistant Sessions
    description: |
      Writes to the caller's own AI assistant sessions, stored in the
      `wazuh-ai-assistant-sessions` data stream.

      **Writes only, by design.** Reads stay as direct queries against the index, where the
      `wazuh_ai_assistant` role's Document Level Security filter (`{"term": {"user":
      "${user.name}"}}`) already scopes each user to their own sessions, and where OpenSearch
      already provides search, sorting, pagination and source filtering. There is no reason to
      reimplement any of that behind an endpoint.

      What DLS cannot do is scope a *write*: it is a read-path filter, so the `user` field it
      filters on was, until these endpoints existed, whatever the client chose to send. These
      four operations close that: the owning `user` is derived from the authenticated principal
      and stamped server-side, overwriting anything the caller sends, and updates and deletes
      check ownership against the stored document first. That is also what makes the read-side
      DLS trustworthy for the first time — it now filters on a field nobody can forge.

      There is no impersonation and no administrative override: `all_access` and `wazuh-admin`
      can only write their own sessions, which is the behaviour the DLS query already had on the
      read path.

      A session the caller does not own is reported as `404`, never `403`, so the response does
      not confirm the existence of another user's session id.

      Writes carry an opaque `version` token (`"<seq_no>:<primary_term>"`). Optimistic
      concurrency is not an opt-in here: the backing store is a data stream, and a data stream
      refuses an unconditional write against one of its backing indices, so every update is
      conditional on a version. Sending `expected_version` on `PUT` widens that check from
      "since this request started" to "since the caller last read the session", which is what
      keeps two browser tabs from silently overwriting one another. After a `409`, re-read the
      session from the index requesting `seq_no_primary_term`, merge, and retry with that version.

security:
  - bearerAuth: []
  - basicAuth: []

paths:
  /settings:
    put:
      summary: Update Wazuh settings
      description: |
        Persists configuration settings to the `.wazuh-settings` index.
        Currently supports the `engine.index_raw_events` boolean flag, which controls
        whether the Engine indexes raw events into the `wazuh-events-raw-v5` data stream.
      operationId: updateSettings
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WazuhSettingsRequest"
            examples:
              enable_raw_events:
                summary: Enable raw event indexing
                value:
                  engine:
                    index_raw_events: true
              disable_raw_events:
                summary: Disable raw event indexing
                value:
                  engine:
                    index_raw_events: false
      responses:
        "200":
          description: OK - Settings updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                success:
                  summary: Settings updated
                  value:
                    message: "Settings updated successfully."
                    status: 200
        "400":
          description: |
            Bad Request - The request could not be processed due to invalid input.

            Common causes:
            - Empty or missing request body
            - Malformed JSON
            - Missing required field (`engine` or `engine.index_raw_events`)
            - Field `engine.index_raw_events` is not a boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                invalid_body:
                  summary: Invalid request body
                  value:
                    message: "Invalid request body."
                    status: 400
                missing_engine:
                  summary: Missing engine field
                  value:
                    message: "Missing required field: 'engine'."
                    status: 400
                missing_index_raw_events:
                  summary: Missing index_raw_events field
                  value:
                    message: "Missing required field: 'engine.index_raw_events'."
                    status: 400
                invalid_type:
                  summary: Wrong type for index_raw_events
                  value:
                    message: "Field 'engine.index_raw_events' must be of type boolean."
                    status: 400
        "500":
          description: |
            Internal Server Error - The server encountered an unexpected error while persisting the settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    message: "Internal Server Error."
                    status: 500

  /ai_assistant/settings:
    get:
      summary: Read the AI assistant's settings and field policy
      description: |
        Reads the reserved settings document in `.wazuh-internal-state`. Providers are stored as separate 
        documents; read them via `GET /ai_assistant/providers`.
      operationId: getAiAssistantSettings
      tags:
        - AI Assistant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantSettingsResponse"
              examples:
                default:
                  summary: Settings and field policy
                  value:
                    privacy_default_on: false
                    privacy_default_per_provider: {}
                    user_can_override: true
                    field_policy:
                      - field: wazuh.agent.name
                        action: anonymize
                        kind: HOST
                      - field: wazuh.agent.host.ip
                        action: anonymize
                        kind: IP
                      - field: wazuh.agent.id
                        action: allow
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/settings/read` cluster permission.
    put:
      summary: Upsert the AI assistant's settings and field policy
      description: |
        Persists the settings and `field_policy` to the reserved settings document in
        `.wazuh-internal-state`. Any other key in the request body is ignored.
      operationId: putAiAssistantSettings
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistantSettingsRequest"
      responses:
        "200":
          description: OK - Settings updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                success:
                  summary: Settings updated
                  value:
                    message: "Settings updated."
                    status: 200
        "400":
          description: Bad Request - Empty or malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/settings/write` cluster permission.

  /ai_assistant/providers:
    get:
      summary: List every AI provider
      description: |
        Returns every provider document in `.wazuh-internal-state`.
      operationId: listAiAssistantProviders
      tags:
        - AI Assistant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantProviderListResponse"
              examples:
                default:
                  summary: Provider list
                  value:
                    providers:
                      - _id: 8c11c90d-1ead-4901-a5f0-1bd6d0a931cb
                        name: test-ai
                        type: anthropic
                        base_url: https://api.anthropic.com
                        model: claude-opus-4-6
                        api_key: "enc:v1:SC/RyOIBkdm+kGl"
                        is_default: true
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/settings/read` cluster permission.
    post:
      summary: Create an AI provider
      description: |
        Creates a new provider document. The body must include an `id`, which must be a UUID and
        is used as the document id.
      operationId: createAiAssistantProvider
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistantProviderCreateRequest"
            examples:
              default:
                summary: Create with a client-supplied UUID
                value:
                  id: 8c11c90d-1ead-4901-a5f0-1bd6d0a931cb
                  name: test-ai
                  type: anthropic
                  base_url: https://api.anthropic.com
                  model: claude-opus-4-6
                  api_key: "enc:v1:SC/RyOIBkdm+kGl"
                  is_default: true
      responses:
        "200":
          description: OK - Provider created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantProviderWriteResponse"
              examples:
                success:
                  summary: Provider saved
                  value:
                    message: "Provider saved."
                    status: 200
                    id: 8c11c90d-1ead-4901-a5f0-1bd6d0a931cb
        "400":
          description: |
            Bad Request - Empty/malformed request body, missing `id`, or a non-UUID `id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                missing_id:
                  summary: Missing id
                  value:
                    message: "Provider id is required."
                    status: 400
                invalid_id:
                  summary: Non-UUID id
                  value:
                    message: "Provider id must be a valid UUID."
                    status: 400
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/settings/write` cluster permission.

  /ai_assistant/providers/{id}:
    put:
      summary: Update an AI provider by id
      description: |
        Creates or updates the provider document with the given id. The path segment is not
        restricted to a UUID, but the reserved ids `wazuh-ai-assistant-settings` and `credentials`
        are rejected.
      operationId: putAiAssistantProvider
      tags:
        - AI Assistant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistantProviderRequest"
      responses:
        "200":
          description: OK - Provider saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantProviderWriteResponse"
        "400":
          description: |
            Bad Request - Empty/malformed request body, or the path `id` is one of the reserved
            document ids (`wazuh-ai-assistant-settings`, `credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                reserved_id:
                  summary: Reserved id
                  value:
                    message: "Provider id is reserved."
                    status: 400
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/settings/write` cluster permission.
    delete:
      summary: Delete an AI provider by id
      description: |
        Deletes the provider document with the given id. The reserved ids
        `wazuh-ai-assistant-settings` and `credentials` are rejected rather than deleted.
      operationId: deleteAiAssistantProvider
      tags:
        - AI Assistant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK - Provider deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantProviderWriteResponse"
              examples:
                success:
                  summary: Provider deleted
                  value:
                    message: "Provider deleted."
                    status: 200
                    id: 8c11c90d-1ead-4901-a5f0-1bd6d0a931cb
        "400":
          description: Bad Request - The id is one of the reserved document ids (`wazuh-ai-assistant-settings`, `credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                reserved_id:
                  summary: Reserved id
                  value:
                    message: "Provider id is reserved."
                    status: 400
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/settings/write` cluster permission.
        "404":
          description: Not Found - No provider exists with the given id.

  /ai_assistant/sessions:
    post:
      summary: Create an AI assistant session
      description: |
        Creates a session owned by the authenticated user.

        Only `title` and `messages` are read from the body. `user`, `@timestamp`, `created_at` and
        `updated_at` are stamped by the server; a value sent for any of them is **discarded, not
        rejected**, so a client may POST back a document it previously read without a `400`. Keys
        outside the allowlist are discarded the same way and never reach the index.

        The document id is generated by the server and returned as `id`. Client-chosen ids are not
        supported: the backing store is a data stream, whose alias only accepts appends
        (`op_type=create`) and mints the id itself.

        The response carries a `version` token, so the client can send it back as
        `expected_version` on its first `PUT` without an intervening read.
      operationId: createAiAssistantSession
      tags:
        - AI Assistant Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistantSessionCreateRequest"
            examples:
              first_turn:
                summary: A session opened with its first turn
                value:
                  title: Any brute force attempts today?
                  messages:
                    - role: user
                      content: Any brute force attempts today?
                      createdAt: 1788961419723
              empty:
                summary: A blank session
                value:
                  title: New chat
                  messages: []
      responses:
        "200":
          description: |
            OK - Session created. Returns `200`, not `201`, matching
            `POST /ai_assistant/providers`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantSession"
              examples:
                success:
                  summary: Session created
                  value:
                    id: 8itvhqABtpJqXy3PWi31
                    title: Any brute force attempts today?
                    created_at: "2026-09-09T13:50:39.861Z"
                    updated_at: "2026-09-09T13:50:39.861Z"
                    messages:
                      - role: user
                        content: Any brute force attempts today?
                        createdAt: 1788961419723
                    version: "12:1"
        "400":
          description: |
            Bad Request - Empty or malformed body, a missing/blank `title`, a `title` over 200
            characters, more than 1000 messages, or a request body over 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                missing_title:
                  summary: Missing title
                  value:
                    message: "Session title is required."
                    status: 400
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/session/write` cluster permission.
        "409":
          description: |
            Conflict - The caller already owns the maximum of 500 sessions. `409` rather than
            `400`: the request is well formed, it is the stored state that blocks it. Deleting a
            session frees a slot. Updating an existing session is never blocked by this cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                cap_reached:
                  summary: Session cap reached
                  value:
                    message: "You have reached the maximum of 500 saved sessions."
                    status: 409

  /ai_assistant/sessions/{id}:
    put:
      summary: Replace an AI assistant session's transcript
      description: |
        Replaces the session's `messages`, and its `title` when one is sent.

        `title` is **optional on purpose**. A chat client auto-saves on every turn; if each save
        resent a recomputed title, it would silently revert a rename the user had just made. When
        the field is absent the stored title is carried over unchanged. `user`, `@timestamp` and
        `created_at` are likewise carried over; `updated_at` is always re-stamped by the server.

        Ownership is checked against the stored document before anything is written. A session
        belonging to another user is reported as `404`, never `403`, so the response does not
        confirm that somebody else's session id exists.

        **Optimistic concurrency is not optional here.** A data stream rejects an unconditional
        write against one of its backing indices outright, so the write always carries an
        `if_seq_no`/`if_primary_term` pair. When the caller sends `expected_version`, that is the
        pair checked, which catches a write made since the *caller's* last read. When it does not,
        the pair this request just read is used instead — the platform requires one either way.

        On `409`, re-read the session directly from the index (with `seq_no_primary_term`), merge,
        and retry with the version that read returned.
      operationId: updateAiAssistantSession
      tags:
        - AI Assistant Sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistantSessionUpdateRequest"
            examples:
              autosave:
                summary: Auto-save after a turn, title untouched
                value:
                  messages:
                    - role: user
                      content: Any brute force attempts today?
                      createdAt: 1788961419723
                    - role: assistant
                      content: No brute force activity in the last 24 hours.
                      createdAt: 1788961419744
                  expected_version: "7:1"
      responses:
        "200":
          description: OK - Session updated. Carries the write's own fresh `version`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantSession"
        "400":
          description: |
            Bad Request - Empty or malformed body, a blank or over-long `title`, more than
            1000 messages, or a request body over 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/session/write` cluster permission.
        "404":
          description: |
            Not Found - No session exists with the given id, or it belongs to another user.
        "409":
          description: |
            Conflict - The session changed since the version being checked against. Re-read the
            session and reapply the change; the write was not applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
              examples:
                conflict:
                  summary: Concurrent modification
                  value:
                    message: "Session was updated by another session since you last loaded it. Refresh and retry."
                    status: 409
    patch:
      summary: Rename an AI assistant session
      description: |
        Changes the session's `title` and nothing else. `messages`, `user`, `created_at` and
        `@timestamp` are carried over untouched.

        Separate from `PUT` because a rename happens from a list row, where the client holds only
        a summary and not the transcript. Requiring a full read just to rename would be wasted
        work and a place for a stale-transcript overwrite to creep in.

        **`updated_at` is deliberately not re-stamped.** A rename is not session activity, and
        bumping it would reorder the session list as if the conversation had just been used.

        The title is trimmed before it is stored. Optimistic concurrency applies as it does on
        `PUT` — the platform requires it — using the pair this request just read; there is no
        `expected_version` on a rename. The response carries the write's own fresh `version`, so
        a client whose renamed session is also the open one does not `409` on its next auto-save.
      operationId: renameAiAssistantSession
      tags:
        - AI Assistant Sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistantSessionRenameRequest"
            examples:
              rename:
                summary: Rename
                value:
                  title: Agent 003 connectivity
      responses:
        "200":
          description: OK - Session renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantSessionRenameResponse"
              examples:
                success:
                  summary: Renamed, updated_at unchanged
                  value:
                    id: 8StohqABtpJqXy3P8S3u
                    title: Agent 003 connectivity
                    updated_at: "2026-09-09T13:44:09.066Z"
                    version: "10:1"
        "400":
          description: |
            Bad Request - Empty or malformed body, a `title` that is blank, whitespace-only or
            over 200 characters, or a request body over 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/session/write` cluster permission.
        "404":
          description: |
            Not Found - No session exists with the given id, or it belongs to another user.
        "409":
          description: |
            Conflict - The session was written or deleted between this request's read and its
            write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestResponse"
    delete:
      summary: Delete an AI assistant session
      description: |
        Deletes the session. Ownership is checked against the stored document first; a session
        belonging to another user is reported as `404` and left untouched.
      operationId: deleteAiAssistantSession
      tags:
        - AI Assistant Sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK - Session deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantSessionWriteResponse"
              examples:
                success:
                  summary: Session deleted
                  value:
                    message: "Session deleted."
                    status: 200
                    id: 8StohqABtpJqXy3P8S3u
        "403":
          description: Forbidden - The caller lacks the `plugin:wazuh/ai_assistant/session/write` cluster permission.
        "404":
          description: |
            Not Found - No session exists with the given id, or it belongs to another user.
            A repeated delete also returns `404`.

components:
  schemas:
    WazuhSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - engine
      properties:
        engine:
          $ref: "#/components/schemas/Engine"

    Engine:
      type: object
      additionalProperties: false
      required:
        - index_raw_events
      properties:
        index_raw_events:
          type: boolean
          description: Whether the Engine indexes raw events into the wazuh-events-raw-v5 data stream.
          example: true

    RestResponse:
      type: object
      description: Standard response schema.
      properties:
        message:
          type: string
        status:
          type: integer
      required:
        - message
        - status

    AiAssistantFieldPolicyEntry:
      type: object
      required:
        - field
        - action
      properties:
        field:
          type: string
          example: wazuh.agent.name
        action:
          type: string
          enum:
            - allow
            - anonymize
        kind:
          type: string
          description: Classifies what is being anonymized. Only present for `anonymize` entries.
          example: HOST

    AiAssistantProvider:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
          example: anthropic
        base_url:
          type: string
          format: uri
        model:
          type: string
        api_key:
          type: string
        is_default:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When this document was last written. Always server-stamped.

    AiAssistantSettingsResponse:
      type: object
      properties:
        privacy_default_on:
          type: boolean
        privacy_default_per_provider:
          type: object
          additionalProperties: true
        user_can_override:
          type: boolean
        field_policy:
          type: array
          items:
            $ref: "#/components/schemas/AiAssistantFieldPolicyEntry"

    AiAssistantProviderListResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AiAssistantProvider"

    AiAssistantSettingsRequest:
      type: object
      description: |
        Only these keys are persisted; anything else is ignored.
      properties:
        privacy_default_on:
          type: boolean
        privacy_default_per_provider:
          type: object
          additionalProperties: true
        user_can_override:
          type: boolean
        field_policy:
          type: array
          items:
            $ref: "#/components/schemas/AiAssistantFieldPolicyEntry"

    AiAssistantProviderRequest:
      type: object
      description: Body for `PUT /ai_assistant/providers/{id}` — the path segment is the id.
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
          example: anthropic
        base_url:
          type: string
          format: uri
        model:
          type: string
        api_key:
          type: string
        is_default:
          type: boolean
        updated_at:
          type: string
          format: date-time
          description: Ignored if sent — always overwritten with a server-stamped timestamp.

    AiAssistantProviderCreateRequest:
      type: object
      description: Body for `POST /ai_assistant/providers`.
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: |
            The document id the provider is created with. Must be a UUID. Never persisted as a
            provider field.
        name:
          type: string
        type:
          type: string
          example: anthropic
        base_url:
          type: string
          format: uri
        model:
          type: string
        api_key:
          type: string
        is_default:
          type: boolean
        updated_at:
          type: string
          format: date-time
          description: Ignored if sent — always overwritten with a server-stamped timestamp.

    AiAssistantProviderWriteResponse:
      type: object
      description: Response for a provider create, update or delete.
      properties:
        message:
          type: string
        status:
          type: integer
        id:
          type: string
          description: Id of the affected provider document.
      required:
        - message
        - status

    AiAssistantSessionMessage:
      type: object
      description: |
        One turn of a session.

        **Informative only — this is not a validated contract.** The index maps `messages` as
        `{"type": "object", "enabled": false}`: the array is stored in `_source` and returned
        verbatim, but never indexed and never schema-checked. This API treats each entry as an
        opaque object and validates only the array's length (1000) and the request body's total
        size (5 MiB), so a
        provider that returns fields nobody anticipated cannot break saving a session. The
        properties below are what the Wazuh Dashboard writes today, recorded so a reader knows
        what to expect; anything else a client sends is preserved as sent.
      additionalProperties: true
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
            - tool
        content:
          type: string
        createdAt:
          type: integer
          format: int64
          description: |
            Epoch milliseconds, not an ISO string — unlike the session's own `created_at` and
            `updated_at`. Display-only, taken from the client's clock.
          example: 1788961419723
        failureReason:
          type: string
          description: Why a turn failed. Present on assistant turns only.
        providerId:
          type: string
        providerName:
          type: string
        providerModel:
          type: string
        privacyEnabled:
          type: boolean

    AiAssistantSession:
      type: object
      description: |
        A full session document, as returned by the `POST` and `PUT` writes. There is no read
        endpoint: listing sessions and reading a transcript stay direct queries against the
        `wazuh-ai-assistant-sessions` data stream, scoped by the `wazuh_ai_assistant` role's
        document-level security filter.
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated document id.
        title:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: |
            Server-stamped on create and carried over unchanged by every later write. The index
            also stores `@timestamp`, always equal to this value — it exists only because the
            data stream requires a timestamp field, and is not exposed here.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: |
            Re-stamped on `POST` and `PUT`. Deliberately **not** re-stamped by `PATCH`, so a
            rename does not reorder the session list.
        messages:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AiAssistantSessionMessage"
        version:
          type: string
          readOnly: true
          description: |
            Opaque optimistic-concurrency token, `"<seq_no>:<primary_term>"`. Never parsed or
            compared by the client — only remembered from the last response seen for this session
            and sent back as `expected_version` on the next `PUT`.
          example: "8:1"

    AiAssistantSessionCreateRequest:
      type: object
      description: |
        Body for `POST /ai_assistant/sessions`. Only `title` and `messages` are persisted; every
        other key, including the server-owned ones below, is discarded rather than rejected.
      additionalProperties: false
      required:
        - title
        - messages
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Must contain something other than whitespace. Trimmed before it is stored.
        messages:
          type: array
          maxItems: 1000
          description: Required, but may be an empty array to open a blank session.
          items:
            $ref: "#/components/schemas/AiAssistantSessionMessage"
        user:
          type: string
          description: |
            Ignored if sent — always overwritten with the authenticated principal. Present here
            only to document that supplying it has no effect; it is the field whose forgeability
            this API exists to remove.
        created_at:
          type: string
          format: date-time
          description: Ignored if sent — always server-stamped.
        updated_at:
          type: string
          format: date-time
          description: Ignored if sent — always server-stamped.

    AiAssistantSessionUpdateRequest:
      type: object
      description: |
        Body for `PUT /ai_assistant/sessions/{id}` — the path segment is the id. `messages`
        replaces the stored array wholesale. Every other stored field is carried over untouched
        except `updated_at`, which is re-stamped.
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AiAssistantSessionMessage"
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Optional on purpose. When absent, the stored title is kept — so an auto-save that
            resends only the transcript cannot revert a rename the user has just made.
        expected_version:
          type: string
          description: |
            The `version` the client last saw for this session. When present, the write is
            rejected with `409` if the stored session has moved past it. When absent, the write
            still carries the pair this request just read, because a data stream permits no
            unconditional write at all — so omitting this weakens the check to "since this
            request started" rather than disabling it.
          example: "7:1"
        user:
          type: string
          description: Ignored if sent — preserved from the stored document.
        created_at:
          type: string
          format: date-time
          description: Ignored if sent — preserved from the stored document.
        updated_at:
          type: string
          format: date-time
          description: Ignored if sent — always re-stamped by the server.

    AiAssistantSessionRenameRequest:
      type: object
      description: Body for `PATCH /ai_assistant/sessions/{id}`. Title only.
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Must contain something other than whitespace. Trimmed before it is stored.

    AiAssistantSessionRenameResponse:
      type: object
      description: |
        What a rename returns: the session's identity and title, its unchanged `updated_at`, and
        the write's own fresh `version` so a client whose renamed session is also the open one
        does not conflict on its next auto-save.
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Unchanged by a rename - see the operation description.
        version:
          type: string
          readOnly: true
          example: "10:1"

    AiAssistantSessionWriteResponse:
      type: object
      description: |
        Response for `DELETE`. The other session writes return the session itself rather than
        this envelope, because the `version` token and the server-stamped timestamps have to
        round-trip to the client.
      properties:
        message:
          type: string
        status:
          type: integer
        id:
          type: string
          description: Id of the affected session document.
      required:
        - message
        - status

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication using JWT (JSON Web Token).
        Include the token in the Authorization header as: `Authorization: Bearer <token>`
    basicAuth:
      type: http
      scheme: basic
      description: |
        **Secure Basic Authentication**.
        Clients must provide username and password encoded in Base64.
