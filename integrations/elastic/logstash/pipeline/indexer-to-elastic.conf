# Writes the documents read from the Wazuh indexer into Elasticsearch data streams.
# Runs after wazuh-indexer-input.conf, wazuh-source.conf and wazuh-data-stream.conf,
# in the same pipeline. The data_stream fields of every document name its data stream.
#
# Settings, from the environment or the Logstash keystore:
#   ELASTIC_HOST       Elasticsearch URL. Default: https://es01:9200.
#   ELASTIC_USERNAME   User with create_doc and auto_configure on logs-wazuh.*-*.
#   ELASTIC_PASSWORD   Password of that user.
#   ELASTIC_CA         CA certificate of Elasticsearch.
output {
  elasticsearch {
    id => "elastic"
    hosts => ["${ELASTIC_HOST:https://es01:9200}"]
    user => "${ELASTIC_USERNAME}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["${ELASTIC_CA:/usr/share/logstash/certs/elastic-ca.crt}"]
    data_stream => true
    # Data streams require ECS compatibility, which the Logstash image disables for the whole pipeline.
    ecs_compatibility => "v8"
    # The id of the source document: a document read again by a later run is rejected as a duplicate.
    document_id => "%{[@metadata][source][_id]}"
    silence_errors_in_log => ["version_conflict_engine_exception"]
  }
}
