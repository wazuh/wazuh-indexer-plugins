# Reads the documents to export from the Wazuh indexer.
#
# Every run of the schedule reads the documents whose @timestamp falls in the window
#   [now - WAZUH_EXPORT_DELAY - WAZUH_EXPORT_LOOKBACK, now - WAZUH_EXPORT_DELAY)
# with both ends rounded down to the minute, so consecutive windows line up.
#
# Two ways of using it, depending on whether the destination drops duplicates:
#   - Overlapping windows (Elasticsearch, OpenSearch): a lookback longer than the schedule
#     interval reads every document several times, and the output drops the copies it has
#     already written by the id of the source document. Defaults: 5m lookback, no delay.
#   - Consecutive windows (Splunk): a lookback equal to the schedule interval reads every
#     document once. The delay leaves time for the documents to be indexed and searchable.
# Either way, a document indexed after its @timestamp left the last window that covers it
# is not exported. Findings carry the @timestamp of the event that triggered them, so they
# are indexed some time after it: the lookback (overlapping) or the delay (consecutive)
# has to cover that time. Documents in the windows of the runs missed while Logstash or
# the Wazuh indexer are down are not exported either.
#
# Settings, from the environment or the Logstash keystore:
#   WAZUH_INDEXER_HOST      Wazuh indexer address. Default: wazuh.indexer:9200.
#   WAZUH_INDEXER_USERNAME  Read-only user to export with.
#   WAZUH_INDEXER_PASSWORD  Password of that user.
#   WAZUH_INDEXER_CA        CA certificate of the Wazuh indexer.
#   WAZUH_EXPORT_INDICES    Comma-separated data streams or patterns to export.
#                           Default: wazuh-findings-v5-*,wazuh-events-v5-*.
#   WAZUH_EXPORT_LOOKBACK   Length of the window read by every run. Default: 5m.
#   WAZUH_EXPORT_DELAY      How far behind the current time the window ends. Default: 0m.
#   WAZUH_EXPORT_SCHEDULE   Cron schedule of the runs. Default: every minute.
input {
  opensearch {
    id => "wazuh-indexer"
    hosts => ["${WAZUH_INDEXER_HOST:wazuh.indexer:9200}"]
    user => "${WAZUH_INDEXER_USERNAME}"
    password => "${WAZUH_INDEXER_PASSWORD}"
    ssl => true
    ca_file => "${WAZUH_INDEXER_CA:/usr/share/logstash/certs/wazuh-indexer-ca.pem}"
    index => "${WAZUH_EXPORT_INDICES:wazuh-findings-v5-*,wazuh-events-v5-*}"
    query => '{ "query": { "range": { "@timestamp": { "gte": "now-${WAZUH_EXPORT_DELAY:0m}-${WAZUH_EXPORT_LOOKBACK:5m}/m", "lt": "now-${WAZUH_EXPORT_DELAY:0m}/m" } } }, "sort": [ "_doc" ] }'
    schedule => "${WAZUH_EXPORT_SCHEDULE:* * * * *}"
    size => 1000
    scroll => "5m"
    docinfo => true
    docinfo_target => "[@metadata][source]"
    docinfo_fields => ["_index", "_id"]
  }
}
