# Reads the documents to export from the Wazuh indexer.
#
# Every run of the schedule reads the documents whose @timestamp falls in the window
#   [now - WAZUH_EXPORT_DELAY - WAZUH_EXPORT_LOOKBACK, now - WAZUH_EXPORT_DELAY)
# with both ends rounded down to the minute. With a lookback equal to the schedule interval
# (the defaults: one minute, every minute), consecutive runs read consecutive windows, and
# every document is read once.
#
# The delay is how long a document can take to be indexed after its @timestamp and still be
# exported. @timestamp is when the Wazuh Engine received the event, and findings carry the
# @timestamp of their event, but the detectors of Ruleset Management write them on their own
# schedule: plugins.content_manager.security_analytics.detector_interval, 2 minutes by default.
# Keep the delay above the longest detector interval plus the time a detector run takes. A
# document indexed after the run that reads its window is never exported.
#
# Documents in the windows of the runs missed while Logstash or the Wazuh indexer are down
# are not exported either: export them with wazuh-indexer-backfill.conf. Elasticsearch and
# OpenSearch drop a document they already have, by the id of the source document, so reading
# a window twice is harmless there. Splunk keeps both copies.
#
# Settings, from the environment or the Logstash keystore:
#   WAZUH_INDEXER_HOST      Wazuh indexer address, host:port. Default: wazuh.indexer:9200.
#                           One node only: to spread the reads over a cluster, point it to a
#                           load balancer, or list the nodes in hosts below, e.g.
#                           hosts => ["node-1:9200", "node-2:9200"].
#   WAZUH_INDEXER_USERNAME  Read-only user to export with.
#   WAZUH_INDEXER_PASSWORD  Password of that user.
#   WAZUH_INDEXER_CA        CA certificate of the Wazuh indexer.
#   WAZUH_EXPORT_INDICES    Comma-separated data streams or patterns to export.
#                           Default: wazuh-findings-v5-*,wazuh-events-v5-*.
#   WAZUH_EXPORT_LOOKBACK   Length of the window read by every run. Default: 1m.
#   WAZUH_EXPORT_DELAY      How far behind the current time the window ends. Default: 5m.
#   WAZUH_EXPORT_SCHEDULE   Cron schedule of the runs. Default: every minute.
input {
  opensearch {
    id => "wazuh-indexer"
    hosts => ["${WAZUH_INDEXER_HOST:wazuh.indexer:9200}"]
    user => "${WAZUH_INDEXER_USERNAME}"
    password => "${WAZUH_INDEXER_PASSWORD}"
    ssl => true
    ca_file => "${WAZUH_INDEXER_CA:/usr/share/logstash/certs/wazuh-indexer-ca.pem}"
    index => "${WAZUH_EXPORT_INDICES:wazuh-findings-v5-*,wazuh-events-v5-*}"
    query => '{ "query": { "range": { "@timestamp": { "gte": "now-${WAZUH_EXPORT_DELAY:5m}-${WAZUH_EXPORT_LOOKBACK:1m}/m", "lt": "now-${WAZUH_EXPORT_DELAY:5m}/m" } } }, "sort": [ "_doc" ] }'
    schedule => "${WAZUH_EXPORT_SCHEDULE:* * * * *}"
    size => 1000
    scroll => "5m"
    docinfo => true
    docinfo_target => "[@metadata][source]"
    docinfo_fields => ["_index", "_id"]
  }
}
