# Identifies the source of every document from the backing index it was read from,
# without adding fields to the document, and removes the @version field Logstash adds:
#   [@metadata][wazuh][stream]    data stream, e.g. wazuh-findings-v5-security.
#   [@metadata][wazuh][kind]      findings, events, or custom for any other data stream.
#   [@metadata][wazuh][category]  category of the Wazuh data streams, or the name of a custom one.
filter {
  ruby {
    id => "wazuh-source"
    code => '
      index = event.get("[@metadata][source][_index]").to_s
      stream = index.sub(/\A\.ds-/, "").sub(/-\d{6}\z/, "")
      if (match = stream.match(/\Awazuh-(findings|events)-v5-([a-z0-9-]+)\z/))
        kind, category = match[1], match[2]
      else
        kind, category = "custom", stream
      end
      event.set("[@metadata][wazuh][stream]", stream)
      event.set("[@metadata][wazuh][kind]", kind)
      event.set("[@metadata][wazuh][category]", category)
    '
    # Logstash adds @version to every event. It is not part of the exported data.
    remove_field => ["@version"]
  }
}
