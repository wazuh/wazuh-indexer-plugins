# Reads, once, the documents of a past time range from the Wazuh indexer: the documents the
# scheduled export of wazuh-indexer-input.conf missed, for example the windows of the runs
# missed while Logstash or the Wazuh indexer were down, or documents indexed after the run
# that read their window.
#
# Use it in place of wazuh-indexer-input.conf, with the same filters and output, in a
# separate run of Logstash: the pipeline ends, and Logstash stops, once the range is read.
# Elasticsearch and OpenSearch drop the documents they already have. Splunk does not:
# give it only the range that is missing.
#
# The source must still hold the range: events are deleted from the Wazuh indexer soon
# after their index rolls over (see the retention of the Setup plugin).
#
# Settings, from the environment or the Logstash keystore, as in wazuh-indexer-input.conf, plus:
#   WAZUH_BACKFILL_FROM   Start of the range, inclusive. ISO 8601, e.g. 2026-10-22T08:00:00Z.
#   WAZUH_BACKFILL_TO     End of the range, exclusive. ISO 8601, e.g. 2026-10-22T10:00:00Z.
input {
  opensearch {
    id => "wazuh-indexer-backfill"
    hosts => ["${WAZUH_INDEXER_HOST:wazuh.indexer:9200}"]
    user => "${WAZUH_INDEXER_USERNAME}"
    password => "${WAZUH_INDEXER_PASSWORD}"
    ssl => true
    ca_file => "${WAZUH_INDEXER_CA:/usr/share/logstash/certs/wazuh-indexer-ca.pem}"
    index => "${WAZUH_EXPORT_INDICES:wazuh-findings-v5-*,wazuh-events-v5-*}"
    query => '{ "query": { "range": { "@timestamp": { "gte": "${WAZUH_BACKFILL_FROM}", "lt": "${WAZUH_BACKFILL_TO}" } } }, "sort": [ "_doc" ] }'
    size => 1000
    scroll => "5m"
    docinfo => true
    docinfo_target => "[@metadata][source]"
    docinfo_fields => ["_index", "_id"]
  }
}
