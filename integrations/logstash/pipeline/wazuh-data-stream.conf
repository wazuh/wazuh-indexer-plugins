# Sets the data_stream fields that name the destination data stream of every document,
# logs-wazuh.<kind>.<category>-<namespace>, for the destinations that store the data
# in data streams (Elasticsearch and OpenSearch). Runs after wazuh-source.conf:
#   logs-wazuh.findings.network_activity-default  from wazuh-findings-v5-network-activity
#   logs-wazuh.events.security-default            from wazuh-events-v5-security
#   logs-wazuh.custom.<data stream>-default       from any other data stream
#
# Settings, from the environment or the Logstash keystore:
#   WAZUH_EXPORT_NAMESPACE   Namespace of the data streams. Default: default.
filter {
  ruby {
    id => "wazuh-data-stream"
    code => '
      # Data stream names cannot contain the - separator, nor uppercase letters.
      dataset = ["wazuh", event.get("[@metadata][wazuh][kind]"), event.get("[@metadata][wazuh][category]")].join(".")
      event.set("[data_stream][type]", "logs")
      event.set("[data_stream][dataset]", dataset.downcase.gsub(/[^a-z0-9._]/, "_")[0, 100])
    '
  }
  mutate {
    id => "wazuh-data-stream-namespace"
    replace => { "[data_stream][namespace]" => "${WAZUH_EXPORT_NAMESPACE:default}" }
  }
}
