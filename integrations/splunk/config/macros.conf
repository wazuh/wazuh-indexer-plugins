# Searches of the Wazuh dashboards. Change the indexes here if the integration writes
# to indexes other than the default ones (SPLUNK_INDEX_FINDINGS, SPLUNK_INDEX_EVENTS).

[wazuh_findings]
definition = index="wazuh-findings" sourcetype="wazuh:findings"

[wazuh_events]
definition = index="wazuh-events" sourcetype="wazuh:events"
