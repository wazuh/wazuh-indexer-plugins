# Sends the documents read from the Wazuh indexer to the Splunk HTTP Event Collector (HEC).
# Runs after wazuh-indexer-input.conf and wazuh-source.conf, in the same pipeline.
#
# HEC has no way to drop a document it already received, so the input has to read every
# document once: consecutive windows, with WAZUH_EXPORT_LOOKBACK equal to the schedule
# interval (see wazuh-indexer-input.conf).
#
# Every document is sent as an HEC event with:
#   time        its @timestamp.
#   host        the name of the Wazuh agent that collected it, or "wazuh".
#   source      the data stream it was read from, e.g. wazuh-findings-v5-security.
#   sourcetype  wazuh:findings, wazuh:events or wazuh:custom.
#   index       the Splunk index of its kind of source.
#   fields      wazuh_document_id, the id of the source document, as an indexed field.
#   event       the document.
#
# Settings, from the environment or the Logstash keystore:
#   SPLUNK_HEC_URL         HEC event endpoint. Default: https://splunk:8088/services/collector/event.
#   SPLUNK_HEC_TOKEN       HEC token, allowed to write to the indexes below.
#   SPLUNK_CA              CA certificate of the HEC endpoint.
#   SPLUNK_INDEX_FINDINGS  Index for findings. Default: wazuh-findings.
#   SPLUNK_INDEX_EVENTS    Index for events. Default: wazuh-events.
#   SPLUNK_INDEX_CUSTOM    Index for any other data stream. Default: wazuh-custom.
filter {
  ruby {
    id => "splunk-hec-event"
    code => '
      kind = event.get("[@metadata][wazuh][kind]")
      indexes = {
        "findings" => "${SPLUNK_INDEX_FINDINGS:wazuh-findings}",
        "events" => "${SPLUNK_INDEX_EVENTS:wazuh-events}",
        "custom" => "${SPLUNK_INDEX_CUSTOM:wazuh-custom}"
      }
      payload = {
        # Fixed-point: HEC rejects the scientific notation a large float is serialized with.
        "time" => format("%.3f", event.get("@timestamp").to_f),
        "host" => event.get("[wazuh][agent][name]") || "wazuh",
        "source" => event.get("[@metadata][wazuh][stream]"),
        "sourcetype" => "wazuh:#{kind}",
        "index" => indexes[kind],
        "fields" => { "wazuh_document_id" => event.get("[@metadata][source][_id]") },
        "event" => LogStash::Json.load(event.to_json)
      }
      event.set("[@metadata][splunk][payload]", LogStash::Json.dump(payload))
    '
  }
}

output {
  http {
    id => "splunk"
    url => "${SPLUNK_HEC_URL:https://splunk:8088/services/collector/event}"
    http_method => "post"
    headers => { "Authorization" => "Splunk ${SPLUNK_HEC_TOKEN}" }
    ssl_certificate_authorities => ["${SPLUNK_CA:/usr/share/logstash/certs/splunk-ca.pem}"]
    content_type => "application/json"
    format => "message"
    message => "%{[@metadata][splunk][payload]}"
  }
}
