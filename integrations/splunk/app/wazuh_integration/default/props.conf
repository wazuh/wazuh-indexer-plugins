# Sourcetypes of the Wazuh data exported from the Wazuh indexer. Every event is a JSON
# document of the Wazuh Common Schema, sent to the HTTP Event Collector with its time.

[wazuh:findings]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[wazuh:events]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[wazuh:custom]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
