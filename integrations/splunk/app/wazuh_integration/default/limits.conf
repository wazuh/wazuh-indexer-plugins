# Search-time field extraction of the Wazuh documents. Splunk extracts the JSON fields of an
# event (KV_MODE = json in props.conf) only when the event is at most maxchars characters
# long, 10240 by default: a larger document, such as a finding that embeds a long
# event.original, would show none of its fields and drop out of every dashboard. Wazuh
# documents are seldom larger than 100 KB. The setting applies to automatic extraction in
# every app, not only to the Wazuh sourcetypes.

[kv]
maxchars = 102400
