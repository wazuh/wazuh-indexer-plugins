# Searches of the Wazuh dashboards. If the integration writes to indexes other than the
# default ones (SPLUNK_INDEX_FINDINGS, SPLUNK_INDEX_EVENTS, SPLUNK_INDEX_CUSTOM), override
# these definitions in local/macros.conf of the app.

[wazuh_findings]
definition = index="wazuh-findings" sourcetype="wazuh:findings"

[wazuh_events]
definition = index="wazuh-events" sourcetype="wazuh:events"

[wazuh_custom]
definition = index="wazuh-custom" sourcetype="wazuh:custom"
