# Indexes of the Wazuh data exported from the Wazuh indexer, one per kind of source.

[wazuh-findings]
homePath = $SPLUNK_DB/wazuh-findings/db
coldPath = $SPLUNK_DB/wazuh-findings/colddb
thawedPath = $SPLUNK_DB/wazuh-findings/thaweddb
maxTotalDataSizeMB = 512000

[wazuh-events]
homePath = $SPLUNK_DB/wazuh-events/db
coldPath = $SPLUNK_DB/wazuh-events/colddb
thawedPath = $SPLUNK_DB/wazuh-events/thaweddb
maxTotalDataSizeMB = 512000

[wazuh-custom]
homePath = $SPLUNK_DB/wazuh-custom/db
coldPath = $SPLUNK_DB/wazuh-custom/colddb
thawedPath = $SPLUNK_DB/wazuh-custom/thaweddb
maxTotalDataSizeMB = 512000
