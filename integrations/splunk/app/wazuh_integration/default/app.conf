# Wazuh integration for Splunk: the indexes, sourcetypes, search macros and dashboards of the
# Wazuh data exported from the Wazuh indexer by Logstash.

[install]
is_configured = true

[ui]
is_visible = true
label = Wazuh

[launcher]
author = Wazuh
description = Dashboards and configuration for the Wazuh findings and events exported from the Wazuh indexer.
version = 5.0.0

[package]
id = wazuh_integration
check_for_updates = false
