# Writes the documents read from the Wazuh indexer into OpenSearch data streams.
# Runs after wazuh-indexer-input.conf, wazuh-source.conf and wazuh-data-stream.conf,
# in the same pipeline. The data_stream fields of every document name its data stream.
#
# Settings, from the environment or the Logstash keystore:
#   OPENSEARCH_HOST       OpenSearch URL, or several separated by spaces. Default: https://opensearch.node:9200.
#   OPENSEARCH_USERNAME   User allowed to append to logs-wazuh.*-*.
#   OPENSEARCH_PASSWORD   Password of that user.
#   OPENSEARCH_CA         CA certificate of OpenSearch.
output {
  opensearch {
    id => "opensearch"
    hosts => ["${OPENSEARCH_HOST:https://opensearch.node:9200}"]
    user => "${OPENSEARCH_USERNAME}"
    password => "${OPENSEARCH_PASSWORD}"
    ssl => true
    cacert => "${OPENSEARCH_CA:/usr/share/logstash/certs/opensearch-ca.pem}"
    index => "%{[data_stream][type]}-%{[data_stream][dataset]}-%{[data_stream][namespace]}"
    # Data streams only accept create. With the id of the source document, a document read
    # again, by a backfill or after a restart, is rejected as a duplicate while the backing
    # index that holds it is the write index.
    action => "create"
    document_id => "%{[@metadata][source][_id]}"
    failure_type_logging_whitelist => ["version_conflict_engine_exception"]
    # The index template is installed beforehand, so this user needs no permission on templates.
    manage_template => false
  }
}
