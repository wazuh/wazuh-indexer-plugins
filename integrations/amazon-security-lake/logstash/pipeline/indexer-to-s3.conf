# Writes the findings read from the Wazuh indexer to the S3 bucket that the AWS Lambda function
# of the integration converts into Amazon Security Lake. Runs after wazuh-indexer-input.conf and
# wazuh-source.conf, in the same pipeline.
#
# Amazon Security Lake receives findings only: documents read from events data streams are
# dropped. Read the findings data streams only (WAZUH_EXPORT_INDICES=wazuh-findings-v5-*, the
# default of the integration), or custom data streams of findings.
#
# Every file is written under the prefix of its source and of the day of its documents,
#   <kind>/<category>/<yyyyMMdd>/   e.g. findings/security/20261022/
# as JSON lines, gzip-compressed. Every document carries the _export object: the id and the
# data stream of the source document, which the Lambda function uses as the id of the finding.
#
# Settings, from the environment or the Logstash keystore:
#   S3_BUCKET_RAW          Bucket to write to.
#   AWS_REGION             Region of the bucket.
#   AWS_ENDPOINT           S3 endpoint, e.g. https://s3.us-east-1.amazonaws.com.
#   S3_TIME_FILE           Minutes a file collects documents before it is uploaded. Default: 5.
#   S3_TEMPORARY_DIRECTORY Directory of the files not uploaded yet, on persistent storage.
#                          Default: /usr/share/logstash/data/s3-temp.
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#                          Credentials, read by the AWS SDK. Without them, the SDK uses the role
#                          of the host (EC2 instance profile, ECS task role).
filter {
  if [@metadata][wazuh][kind] == "events" {
    drop { id => "amazon-security-lake-drop-events" }
  }
  mutate {
    id => "amazon-security-lake-export"
    add_field => {
      "[_export][id]" => "%{[@metadata][source][_id]}"
      "[_export][data_stream]" => "%{[@metadata][wazuh][stream]}"
    }
  }
}

output {
  s3 {
    id => "amazon-security-lake"
    bucket => "${S3_BUCKET_RAW}"
    region => "${AWS_REGION}"
    endpoint => "${AWS_ENDPOINT}"
    prefix => "%{[@metadata][wazuh][kind]}/%{[@metadata][wazuh][category]}/%{+yyyyMMdd}/"
    codec => "json_lines"
    encoding => "gzip"
    time_file => "${S3_TIME_FILE:5}"
    server_side_encryption => true
    server_side_encryption_algorithm => "AES256"
    # The files not uploaded yet survive a restart, and are uploaded when Logstash starts again.
    temporary_directory => "${S3_TEMPORARY_DIRECTORY:/usr/share/logstash/data/s3-temp}"
    restore => true
    # The writer needs no access to the root of the bucket.
    validate_credentials_on_root_bucket => false
    additional_settings => {
      "force_path_style" => true
    }
  }
}
