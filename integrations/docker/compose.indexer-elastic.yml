name: "elastic-integration"

include:
  - compose.wazuh-indexer.yml

services:
  # =================================
  # Elasticsearch and Kibana
  # =================================
  # https://www.elastic.co/guide/en/elastic-stack-get-started/current/get-started-docker.html

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - es_certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: kibana\n"\
          "    dns:\n"\
          "      - kibana\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R 1000:1000 config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - es_certs:/usr/share/elasticsearch/config/certs
    ports:
      - ${ES_PORT}:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # Installs the index template and creates the role and user that Logstash writes with.
  elastic-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    depends_on:
      es01:
        condition: service_healthy
    entrypoint: ["bash", "/setup/elastic-destination.sh"]
    environment:
      - ELASTIC_URL=https://es01:9200
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_LOGSTASH_USERNAME=${ELASTIC_LOGSTASH_USERNAME}
      - ELASTIC_LOGSTASH_PASSWORD=${ELASTIC_LOGSTASH_PASSWORD}
    volumes:
      - ./setup/elastic-destination.sh:/setup/elastic-destination.sh:ro
      - ../elastic/templates/wazuh-index-template.json:/setup/wazuh-index-template.json:ro
      - es_certs:/setup/certs:ro

  kibana:
    depends_on:
      es01:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    volumes:
      - es_certs:/usr/share/kibana/config/certs
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_KEY=/usr/share/kibana/config/certs/kibana/kibana.key
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/kibana/kibana.crt
    mem_limit: ${MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I https://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # =================================
  # Logstash
  # =================================

  logstash:
    depends_on:
      wazuh-indexer-setup:
        condition: service_completed_successfully
      elastic-setup:
        condition: service_completed_successfully
    image: logstash-oss:${LOGSTASH_OSS_VERSION}
    build:
      context: ../logstash
      args:
        - LOGSTASH_OSS_VERSION=${LOGSTASH_OSS_VERSION}
    environment:
      LOG_LEVEL: info
      MONITORING_ENABLED: false
      # Events read but not delivered yet survive a restart. Documents that the destination
      # rejects (other than duplicates) are kept in the dead letter queue.
      QUEUE_TYPE: persisted
      DEAD_LETTER_QUEUE_ENABLE: "true"
      WAZUH_INDEXER_HOST: wazuh.indexer:9200
      WAZUH_INDEXER_USERNAME: ${WAZUH_EXPORT_USERNAME}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_EXPORT_PASSWORD}
      WAZUH_INDEXER_CA: /usr/share/logstash/certs/wazuh-indexer-ca.pem
      WAZUH_EXPORT_INDICES: ${WAZUH_EXPORT_INDICES}
      WAZUH_EXPORT_LOOKBACK: ${WAZUH_EXPORT_LOOKBACK}
      WAZUH_EXPORT_SCHEDULE: ${WAZUH_EXPORT_SCHEDULE}
      ELASTIC_HOST: https://es01:9200
      ELASTIC_USERNAME: ${ELASTIC_LOGSTASH_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_LOGSTASH_PASSWORD}
      ELASTIC_CA: /usr/share/logstash/certs/elastic/ca/ca.crt
    volumes:
      - ../logstash/pipeline/wazuh-indexer-input.conf:/usr/share/logstash/pipeline-wazuh/10-wazuh-indexer-input.conf:ro
      - ../logstash/pipeline/wazuh-source.conf:/usr/share/logstash/pipeline-wazuh/20-wazuh-source.conf:ro
      - ../logstash/pipeline/wazuh-data-stream.conf:/usr/share/logstash/pipeline-wazuh/30-wazuh-data-stream.conf:ro
      - ../elastic/logstash/pipeline/indexer-to-elastic.conf:/usr/share/logstash/pipeline-wazuh/40-indexer-to-elastic.conf:ro
      - ./certs/root-ca.pem:/usr/share/logstash/certs/wazuh-indexer-ca.pem:ro
      - es_certs:/usr/share/logstash/certs/elastic:ro
      - logstash-data:/usr/share/logstash/data
    command: logstash -f "/usr/share/logstash/pipeline-wazuh/*.conf"

volumes:
  logstash-data:
  es_certs:
