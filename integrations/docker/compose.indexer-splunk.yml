name: "splunk-integration"

include:
  - compose.wazuh-indexer.yml

services:
  # =================================
  # Splunk
  # =================================

  # Development certificate of Splunk, issued by the CA of the environment.
  generator:
    image: cfssl/cfssl:v1.7.1
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
    volumes:
      - ./certs/:/certs/
      - ../splunk/cfssl/:/conf/
    entrypoint: /bin/bash
    command: >
      -c '
        cd /certs
      	cat /conf/host.json | \
      	cfssl gencert \
      		-ca root-ca.pem \
      		-ca-key root-ca.key \
      		-config /conf/cfssl.json \
      		-profile=peer - | \
      	cfssljson -bare splunk
      	openssl pkcs8 -topk8 -inform pem -in splunk-key.pem -outform pem -nocrypt -out splunk.key
        rm splunk.csr
        cat splunk.pem splunk-key.pem root-ca.pem > splunkhec.pem
        chown -R 1000:1000 /certs/splunk*
      '

  splunk:
    image: splunk/splunk:${SPLUNK_VERSION}
    user: root
    volumes:
      - ./certs/splunk.key:/opt/splunk/etc/auth/custom/splunk.key
      - ./certs/splunk.pem:/opt/splunk/etc/auth/custom/splunk.pem
      - ./certs/splunkhec.pem:/opt/splunk/etc/auth/custom/splunkhec.pem
      - ../splunk/config/indexes.conf:/opt/splunk/etc/system/local/indexes.conf
      - ../splunk/config/props.conf:/opt/splunk/etc/system/local/props.conf
      - ../splunk/config/macros.conf:/opt/splunk/etc/system/local/macros.conf
      - ../splunk/config/default.yml:/tmp/defaults/default.yml
    depends_on:
      generator:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
      - "8088:8088"
    environment:
      SPLUNK_VERSION: ${SPLUNK_VERSION}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
      SPLUNK_HOSTNAME: splunk
      SPLUNK_HTTP_ENABLESSL: "true"
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_STANDALONE_URL: https://splunk:8080
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_START_ARGS: --accept-license --run-as-root

  # =================================
  # Logstash
  # =================================

  logstash:
    image: logstash-oss:${LOGSTASH_OSS_VERSION}
    depends_on:
      wazuh-indexer-setup:
        condition: service_completed_successfully
      splunk:
        condition: service_healthy
    build:
      context: ../logstash
      args:
        - LOGSTASH_OSS_VERSION=${LOGSTASH_OSS_VERSION}
    environment:
      LOG_LEVEL: info
      MONITORING_ENABLED: false
      # Events read but not delivered yet survive a restart. Documents that the destination
      # rejects (other than duplicates) are kept in the dead letter queue.
      QUEUE_TYPE: persisted
      DEAD_LETTER_QUEUE_ENABLE: "true"
      WAZUH_INDEXER_HOST: wazuh.indexer:9200
      WAZUH_INDEXER_USERNAME: ${WAZUH_EXPORT_USERNAME}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_EXPORT_PASSWORD}
      WAZUH_INDEXER_CA: /usr/share/logstash/certs/wazuh-indexer-ca.pem
      WAZUH_EXPORT_INDICES: ${WAZUH_EXPORT_INDICES}
      # Splunk cannot drop duplicates: every run reads one minute, two minutes behind,
      # so that every document is read once.
      WAZUH_EXPORT_LOOKBACK: 1m
      WAZUH_EXPORT_DELAY: 2m
      WAZUH_EXPORT_SCHEDULE: "* * * * *"
      SPLUNK_HEC_URL: https://splunk:8088/services/collector/event
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
      SPLUNK_CA: /usr/share/logstash/certs/splunk-ca.pem
    volumes:
      - ../logstash/pipeline/wazuh-indexer-input.conf:/usr/share/logstash/pipeline-wazuh/10-wazuh-indexer-input.conf:ro
      - ../logstash/pipeline/wazuh-source.conf:/usr/share/logstash/pipeline-wazuh/20-wazuh-source.conf:ro
      - ../splunk/logstash/pipeline/indexer-to-splunk.conf:/usr/share/logstash/pipeline-wazuh/40-indexer-to-splunk.conf:ro
      - ./certs/root-ca.pem:/usr/share/logstash/certs/wazuh-indexer-ca.pem:ro
      - ./certs/root-ca.pem:/usr/share/logstash/certs/splunk-ca.pem:ro
      - logstash-data:/usr/share/logstash/data
    command: logstash -f "/usr/share/logstash/pipeline-wazuh/*.conf"

volumes:
  logstash-data:
