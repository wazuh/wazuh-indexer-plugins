name: "opensearch-integration"

include:
  - compose.wazuh-indexer.yml

services:
  # ================================================
  # OpenSearch and OpenSearch Dashboards
  # ================================================

  opensearch.node:
    image: opensearchproject/opensearch:${OS_VERSION}
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch.node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    volumes:
      - ../opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      - ./certs/opensearch.node-key.pem:/usr/share/opensearch/config/certs/opensearch.key
      - ./certs/opensearch.node.pem:/usr/share/opensearch/config/certs/opensearch.pem
      - ./certs/root-ca.pem:/usr/share/opensearch/config/certs/root-ca.pem
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9201:9200
      - 9600:9600
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sku admin:${OPENSEARCH_ADMIN_PASSWORD} https://opensearch.node:9200 2>&1 | grep -q 'The OpenSearch Project: https://opensearch.org/'",
        ]
      interval: 5s
      timeout: 5s
      retries: 60

  # Installs the index template and creates the role and user that Logstash writes with.
  opensearch-setup:
    image: opensearchproject/opensearch:${OS_VERSION}
    depends_on:
      opensearch.node:
        condition: service_healthy
    entrypoint: ["bash", "/setup/opensearch-destination.sh"]
    environment:
      - OPENSEARCH_URL=https://opensearch.node:9200
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - OPENSEARCH_LOGSTASH_USERNAME=${OPENSEARCH_LOGSTASH_USERNAME}
      - OPENSEARCH_LOGSTASH_PASSWORD=${OPENSEARCH_LOGSTASH_PASSWORD}
    volumes:
      - ./setup/opensearch-destination.sh:/setup/opensearch-destination.sh:ro
      - ../opensearch/templates/wazuh-index-template.json:/setup/wazuh-index-template.json:ro
      - ./certs/root-ca.pem:/setup/root-ca.pem:ro

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OS_VERSION}
    depends_on:
      opensearch.node:
        condition: service_healthy
    ports:
      - 5602:5601
    expose:
      - "5602"
    volumes:
      - ../opensearch/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
      - ./certs/:/usr/share/opensearch-dashboards/config/certs/
      - ./certs/opensearch.dashboards-key.pem:/usr/share/opensearch-dashboards/config/certs/opensearch.key
      - ./certs/opensearch.dashboards.pem:/usr/share/opensearch-dashboards/config/certs/opensearch.pem
      - ./certs/root-ca.pem:/usr/share/opensearch-dashboards/config/certs/root-ca.pem
    environment:
      - 'OPENSEARCH_HOSTS="https://opensearch.node:9200"'

  # =================================
  # Logstash
  # =================================

  logstash:
    depends_on:
      wazuh-indexer-setup:
        condition: service_completed_successfully
      opensearch-setup:
        condition: service_completed_successfully
    image: logstash-oss:${LOGSTASH_OSS_VERSION}
    build:
      context: ../logstash
      args:
        - LOGSTASH_OSS_VERSION=${LOGSTASH_OSS_VERSION}
    environment:
      LOG_LEVEL: info
      MONITORING_ENABLED: false
      # Events read but not delivered yet survive a restart. Documents that the destination
      # rejects (other than duplicates) are kept in the dead letter queue.
      QUEUE_TYPE: persisted
      DEAD_LETTER_QUEUE_ENABLE: "true"
      WAZUH_INDEXER_HOST: wazuh.indexer:9200
      WAZUH_INDEXER_USERNAME: ${WAZUH_EXPORT_USERNAME}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_EXPORT_PASSWORD}
      WAZUH_INDEXER_CA: /usr/share/logstash/certs/wazuh-indexer-ca.pem
      WAZUH_EXPORT_INDICES: ${WAZUH_EXPORT_INDICES}
      WAZUH_EXPORT_LOOKBACK: ${WAZUH_EXPORT_LOOKBACK}
      WAZUH_EXPORT_SCHEDULE: ${WAZUH_EXPORT_SCHEDULE}
      OPENSEARCH_HOST: https://opensearch.node:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_LOGSTASH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_LOGSTASH_PASSWORD}
      OPENSEARCH_CA: /usr/share/logstash/certs/opensearch-ca.pem
    volumes:
      - ../logstash/pipeline/wazuh-indexer-input.conf:/usr/share/logstash/pipeline-wazuh/10-wazuh-indexer-input.conf:ro
      - ../logstash/pipeline/wazuh-source.conf:/usr/share/logstash/pipeline-wazuh/20-wazuh-source.conf:ro
      - ../logstash/pipeline/wazuh-data-stream.conf:/usr/share/logstash/pipeline-wazuh/30-wazuh-data-stream.conf:ro
      - ../opensearch/logstash/pipeline/indexer-to-opensearch.conf:/usr/share/logstash/pipeline-wazuh/40-indexer-to-opensearch.conf:ro
      - ./certs/root-ca.pem:/usr/share/logstash/certs/wazuh-indexer-ca.pem:ro
      - ./certs/root-ca.pem:/usr/share/logstash/certs/opensearch-ca.pem:ro
      - logstash-data:/usr/share/logstash/data
    command: logstash -f "/usr/share/logstash/pipeline-wazuh/*.conf"

volumes:
  logstash-data:
