name: "amazon-security-lake-integration"

# Amazon Security Lake integration, with no AWS account: the moto server stands in for S3 (the
# raw bucket that Logstash writes to, and the Security Lake bucket) and STS, the AWS Lambda
# runtime interface emulator runs the function, and the s3-notifier stands in for the S3 event
# notifications that invoke it.

include:
  - compose.wazuh-indexer.yml

services:
  s3:
    image: motoserver/moto:5.2.3
    ports:
      - 5000:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 5s
      timeout: 5s
      retries: 30

  lambda:
    image: wazuh/indexer-security-lake-integration:lambda
    build:
      context: ../amazon-security-lake
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT: http://s3:5000
      AWS_BUCKET: ${SECURITY_LAKE_BUCKET}
      SOURCE_LOCATION: ${SECURITY_LAKE_SOURCE_LOCATION}
      ACCOUNT_ID: ${SECURITY_LAKE_ACCOUNT_ID}
      REGION: ${AWS_REGION}
      S3_BUCKET_OCSF: ${S3_BUCKET_OCSF}
    depends_on:
      s3:
        condition: service_healthy

  s3-notifier:
    build:
      context: ../amazon-security-lake/dev
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT: http://s3:5000
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      BUCKETS: ${S3_BUCKET_RAW},${SECURITY_LAKE_BUCKET},${S3_BUCKET_OCSF}
      LAMBDA_URL: http://lambda:8080/2015-03-31/functions/function/invocations
      POLL_SECONDS: "10"
    depends_on:
      s3:
        condition: service_healthy
      lambda:
        condition: service_started

  logstash:
    depends_on:
      wazuh-indexer-setup:
        condition: service_completed_successfully
      s3-notifier:
        condition: service_started
    image: logstash-oss:${LOGSTASH_OSS_VERSION}
    build:
      context: ../logstash
      args:
        - LOGSTASH_OSS_VERSION=${LOGSTASH_OSS_VERSION}
    environment:
      LOG_LEVEL: info
      MONITORING_ENABLED: false
      QUEUE_TYPE: persisted
      WAZUH_INDEXER_HOST: wazuh.indexer:9200
      WAZUH_INDEXER_USERNAME: ${WAZUH_EXPORT_USERNAME}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_EXPORT_PASSWORD}
      WAZUH_INDEXER_CA: /usr/share/logstash/certs/wazuh-indexer-ca.pem
      # Amazon Security Lake receives findings only.
      WAZUH_EXPORT_INDICES: ${SECURITY_LAKE_EXPORT_INDICES}
      WAZUH_EXPORT_LOOKBACK: ${WAZUH_EXPORT_LOOKBACK}
      WAZUH_EXPORT_DELAY: ${WAZUH_EXPORT_DELAY}
      WAZUH_EXPORT_SCHEDULE: ${WAZUH_EXPORT_SCHEDULE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT: http://s3:5000
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_TIME_FILE: ${S3_TIME_FILE}
    volumes:
      - ../logstash/pipeline/wazuh-indexer-input.conf:/usr/share/logstash/pipeline-wazuh/10-wazuh-indexer-input.conf:ro
      - ../logstash/pipeline/wazuh-source.conf:/usr/share/logstash/pipeline-wazuh/20-wazuh-source.conf:ro
      - ../amazon-security-lake/logstash/pipeline/indexer-to-s3.conf:/usr/share/logstash/pipeline-wazuh/40-indexer-to-s3.conf:ro
      - ./certs/root-ca.pem:/usr/share/logstash/certs/wazuh-indexer-ca.pem:ro
      - logstash-data:/usr/share/logstash/data
    command: logstash -f "/usr/share/logstash/pipeline-wazuh/*.conf"

volumes:
  logstash-data:
