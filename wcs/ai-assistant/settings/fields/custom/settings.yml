---
- name: base
  title: Wazuh AI Assistant Settings
  description: >
    Fields describing the AI providers and models, the global settings, and the
    field anonymization policy of the Wazuh AI assistant.
  type: group
  group: 2
  fields:
    - name: providers.name
      type: keyword
      level: custom
      description: >
        Name given to the provider configuration.
      example: "test-ai"
    - name: providers.type
      type: keyword
      level: custom
      description: >
        Provider implementation to use.
      example: "anthropic"
    - name: providers.base_url
      type: keyword
      level: custom
      description: >
        Base URL of the provider's API.
      example: "https://api.anthropic.com"
    - name: providers.model
      type: keyword
      level: custom
      description: >
        Model to request from the provider.
      example: "claude-opus-4-6"
    - name: providers.api_key
      type: keyword
      level: custom
      description: >
        Encrypted API key used to authenticate against the provider.
    - name: providers.is_default
      type: boolean
      level: custom
      description: >
        Whether this provider is the one used by default.
      example: true
    - name: settings.privacy_default_on
      type: boolean
      level: custom
      short: Whether privacy mode is enabled by default for new conversations.
      description: >
        Whether privacy mode is enabled by default for new conversations.
      example: false
    - name: settings.privacy_default_per_provider
      type: object
      level: custom
      short: Per-provider override of the default privacy mode.
      description: >
        Per-provider override of the default privacy mode, keyed by provider name.
      example: '{"test-ai": true}'
    - name: settings.user_can_override
      type: boolean
      level: custom
      short: Whether users may override the default privacy setting for their own conversations.
      description: >
        Whether users are allowed to override the default privacy setting for
        their own conversations.
      example: true
    - name: field_policy.field
      type: keyword
      level: custom
      short: Fully qualified name of the event field this policy entry applies to.
      description: >
        Fully qualified name of the event field this policy entry applies to.
      example: "wazuh.agent.name"
    - name: field_policy.action
      type: keyword
      level: custom
      short: Whether the field is sent to the AI provider verbatim or anonymized first.
      description: >
        Whether the field is sent to the AI provider verbatim ('allow') or
        anonymized before it leaves the cluster ('anonymize').
      example: "anonymize"
    - name: field_policy.kind
      type: keyword
      level: custom
      short: What kind of data is being anonymized. Only set on 'anonymize' entries.
      description: >
        What kind of data is being anonymized (e.g. 'HOST', 'IP'). Only set on
        entries whose action is 'anonymize'.
      example: "HOST"
    - name: visible_to
      type: keyword
      level: custom
      normalize:
        - array
      short: List of backend roles allowed to read the document.
      description: >
        Backend roles allowed to read the document. Set on every document by
        the setup plugin's action filter, and matched against the reader's own
        backend roles by the Document Level Security query of the
        'wazuh_ai_assistant_settings' role. Not written by clients.
      example: '["admin", "wazuh-admin"]'
