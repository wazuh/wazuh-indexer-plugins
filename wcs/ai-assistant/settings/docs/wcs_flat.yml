    roles by the Document Level Security query of the 'wazuh_ai_assistant_settings'
    role. Not written by clients.
  example: '["admin", "wazuh-admin"]'
  flat_name: visible_to
  ignore_above: 1024
  level: custom
  name: visible_to
  normalize:
  - array
  short: List of backend roles allowed to read the document.
  type: keyword
