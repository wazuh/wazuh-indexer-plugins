'@timestamp':
  dashed_name: timestamp
  description: 'Date/time when the event originated.

    This is the date/time extracted from the event, typically representing when the
    event was generated by the source.

    If the event source has no original timestamp, this value is typically populated
    by the first time the event was received by the pipeline.

    Required field for all events.'
  example: '2016-05-23T08:05:34.853Z'
  flat_name: '@timestamp'
  level: core
  name: '@timestamp'
  normalize: []
  otel:
  - otlp_field: time_unix_nano
    relation: otlp
    stability: stable
  - otlp_field: observed_time_unix_nano
    relation: otlp
    stability: stable
  - note: 'On logs, events and metrics, `time_unix_nano` defines the time of the event.
      For logs, `observed_time_unix_nano` defines the time when the event was observed
      by the collection system. On spans, `start_time_unix_nano` represents the start
      time of the span.

      '
    otlp_field: start_time_unix_nano
    relation: otlp
    stability: stable
  required: true
  short: Date/time when the event originated.
  type: date
created_at:
  dashed_name: created-at
  description: Date and time when the conversation was created.
  example: '2026-08-03T12:43:45.534Z'
  flat_name: created_at
  level: custom
  name: created_at
  normalize: []
  short: Date and time when the conversation was created.
  type: date
messages:
  dashed_name: messages
  description: 'Conversation turns (author and content, plus any other data returned
    by the AI provider). Shape varies by provider, so the object is unmapped: stored
    in _source and returned as-is, but neither indexed nor searchable. Only used to
    reconstruct the conversation in the UI.'
  doc_values: false
  enabled: false
  example: '[{"created_at": 1785761025503, "role": "user", "content": "how many agents
    are connected?"}]'
  flat_name: messages
  index: false
  level: custom
  name: messages
  normalize: []
  short: Conversation turns, stored verbatim to reconstruct the chat in the UI.
  type: object
title:
  dashed_name: title
  description: Title of the conversation, usually derived from the first message sent
    by the user.
  example: how many agents are connected?
  flat_name: title
  ignore_above: 1024
  level: custom
  name: title
  normalize: []
  short: Title of the conversation, usually derived from the first message sent by
    the user.
  type: keyword
updated_at:
  dashed_name: updated-at
  description: Date and time when the conversation was last updated.
  example: '2026-08-03T12:43:46.475Z'
  flat_name: updated_at
  level: custom
  name: updated_at
  normalize: []
  short: Date and time when the conversation was last updated.
  type: date
user:
  dashed_name: user
  description: Name of the user the conversation belongs to.
  example: admin
  flat_name: user
  ignore_above: 1024
  level: custom
  name: user
  normalize: []
  short: Name of the user the conversation belongs to.
  type: keyword
