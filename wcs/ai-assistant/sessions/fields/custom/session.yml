---
- name: base
  title: Wazuh AI Assistant Sessions
  description: >
    Fields describing a user's conversation with the Wazuh AI assistant.
  type: group
  group: 2
  fields:
    - name: user
      type: keyword
      level: custom
      description: >
        Name of the user the conversation belongs to.
      example: "admin"
    - name: title
      type: keyword
      level: custom
      description: >
        Title of the conversation, usually derived from the first message sent by the user.
      example: "how many agents are connected?"
    - name: created_at
      type: date
      level: custom
      description: >
        Date and time when the conversation was created.
      example: "2026-08-03T12:43:45.534Z"
    - name: updated_at
      type: date
      level: custom
      description: >
        Date and time when the conversation was last updated.
      example: "2026-08-03T12:43:46.475Z"
    - name: messages.created_at
      type: date
      level: custom
      description: >
        Date and time when the message was created.
      example: "2026-08-03T12:43:45.503Z"
    - name: messages.role
      type: keyword
      level: custom
      description: >
        Author of the message. One of: user, assistant, system.
      example: "user"
    - name: messages.content
      type: match_only_text
      level: custom
      description: >
        Body of the message.
      example: "how many agents are connected?"
