---
- name: base
  title: Wazuh AI Assistant Providers
  description: >
    Fields describing the configuration of an AI provider and model used by the
    Wazuh AI assistant.
  type: group
  group: 2
  fields:
    - name: name
      type: keyword
      level: custom
      description: >
        Name given to the provider configuration.
      example: "test-ai"
    - name: type
      type: keyword
      level: custom
      description: >
        Provider implementation to use.
      example: "anthropic"
    - name: base_url
      type: keyword
      level: custom
      description: >
        Base URL of the provider's API.
      example: "https://api.anthropic.com"
    - name: model
      type: keyword
      level: custom
      description: >
        Model to request from the provider.
      example: "claude-opus-4-6"
    - name: api_key
      type: keyword
      level: custom
      description: >
        Encrypted API key used to authenticate against the provider.
    - name: is_default
      type: boolean
      level: custom
      description: >
        Whether this provider is the one used by default.
      example: true
