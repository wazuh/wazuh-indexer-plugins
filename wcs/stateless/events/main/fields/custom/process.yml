---
- name: process
  fields:
    - name: state
      type: keyword
      level: custom
      description: >
        Current state of the process, as reported by the collector.
      example: S
    # `process.parent` itself is reused (ECS process self-nesting) from a
    # snapshot of process's own top-level fields taken before that reuse
    # runs, same snapshot `process.previous` is built from. Declaring
    # `parent.pid` here is what makes it available as `process.previous.parent.pid`;
    # the identical, richer `process.parent.pid` generated by the ECS reuse
    # takes precedence at the top level, so this has no effect there.
    - name: parent.pid
      type: long
      level: custom
      description: >
        PID of the parent process.
      example: 1
