---
- name: wazuh
  title: Wazuh
  short: Fields Wazuh adds to describe how it collected and processed the event.
  description: >
    Fields that Wazuh adds to describe how it collected and processed the
    event: the agent and cluster involved, the integration and decoders that
    matched, the identifier of the received log and, in findings, the Wazuh
    rule that matched. They are not parsed from the original log: the Wazuh
    agent, the Wazuh Engine and the Wazuh Indexer set them, except the case
    management fields of findings, which users manage.
  fields:
    - name: event.id
      type: keyword
      level: custom
      short: ID of the received log, shared by its raw event, normalized event and findings.
      description: >
        Identifier (UUID version 4) that the Wazuh Engine generates once for
        every log it receives. The raw event in `wazuh-events-raw-v5`, the
        normalized event and every finding produced from them carry the same
        value, so it links all the documents that come from one log. It is not
        the document `_id`.
      example: "a715177a-217c-4103-bc79-37c5766025ac"
    - name: integration.name
      type: keyword
      level: custom
      description: >
        Name of the integration whose decoder matched the event, set by the
        Wazuh Engine.
      example: "apache-http"
    - name: integration.decoders
      type: keyword
      short: Decoders that matched the event, from the root decoder to the most specific one.
      description: >
        Names of the decoders that matched the event, in the order the Wazuh
        Engine applied them, from the root decoder to the most specific one.
      normalize:
        - array
      level: custom
      example: '["decoder/core-wazuh-message/0", "decoder/syslog/0", "decoder/system-auth/0"]'
    - name: integration.rules
      type: keyword
      level: custom
      short: Currently not populated. A finding identifies the rule that matched in `wazuh.rule`.
      description: >
        Reserved for the rules applied to the event. Currently not populated: a
        finding identifies the Wazuh rule that matched in `wazuh.rule`.
      normalize:
        - array
      example: '["8784f095-729a-5912-9315-119722b444ed"]'
    - name: integration.category
      type: keyword
      level: custom
      short: Category of the integration. Selects the data stream, `wazuh-events-v5-<category>`.
      description: >
        Category of the integration whose decoder matched the event, set by the
        Wazuh Engine. It selects the data stream the event is written to,
        `wazuh-events-v5-<category>`, and the one its findings are written to,
        `wazuh-findings-v5-<category>`. One of `access-management`,
        `applications`, `cloud-services`, `network-activity`, `other`,
        `security`, `system-activity` or `unclassified`.
      example: "system-activity"
    - name: cluster.name
      type: keyword
      level: custom
      description: >
        Name of the Wazuh Manager cluster that processed the event.
      example: "wazuh"
    - name: cluster.node
      type: keyword
      level: custom
      description: >
        Name of the Wazuh Manager node that processed the event. Raw events do
        not carry it.
      example: "node01"
    - name: space.name
      type: keyword
      level: custom
      short: Space of the policy that processed the event, `standard` or `custom`.
      description: >
        Space of the Wazuh Engine policy that processed the event: `standard`
        for the Wazuh ruleset, `custom` for user content promoted to
        production.
      example: "standard"
    - name: space.event_discarded
      type: boolean
      level: custom
      short: When `true`, the event would have been discarded.
      description: >
        Indicates whether the event would have been discarded by the Wazuh Engine during the filtering phase when the active policy has `index_discarded_events` set to `true`. 
      example: false
    - name: protocol.location
      type: keyword
      level: custom
      short: Where the Wazuh agent collected the event, such as a file path, `journald` or a module name.
      description: >
        Source of the event as reported by the Wazuh agent: the path of the
        monitored file, the log channel (for example `journald`), or the name
        of the agent module that generated the event (for example
        `syscollector` or `rootcheck`).
      example: "/var/log/auth.log"
    - name: protocol.queue
      type: byte
      level: custom
      short: Byte value of the agent queue character the event came through, such as 49 for queue `1`.
      description: >
        Queue the Wazuh agent sent the event through, stored as the byte value
        of the queue character: for example `49` (`1`) for log collector
        events, `57` (`9`) for rootcheck and `100` (`d`) for syscollector.
      example: 49
    - name: schema.version
      type: keyword
      level: custom
      description: >
        Version of the schema the document follows. Events and findings do not
        carry it.
      example: "1.0.0"
    - name: case.title
      type: match_only_text
      level: custom
      description: >
        Title summarizing the case.
      example: "Sample Case Title"
    - name: case.description
      type: match_only_text
      level: custom
      description: >
        Detailed description of the case.
      example: "This is a sample description for the case."
    - name: case.user.name
      type: keyword
      level: custom
      description: >
        Name of the user that owns the case. Not editable by the user.
      example: "admin"
    - name: case.status
      type: keyword
      level: custom
      description: >
        Current status of the case. One of active, acknowledged, completed, error, deleted, audit.
      example: "active"
    - name: case.severity
      type: keyword
      level: custom
      description: >
        Severity of the case. One of informational, low, medium, high, critical.
      example: "medium"
    - name: case.priority
      type: keyword
      level: custom
      description: >
        Priority of the case. One of low, medium, high, urgent.
      example: "medium"
    - name: case.tlp
      type: keyword
      level: custom
      description: >
        Traffic Light Protocol classification of the case. One of TLP:RED, TLP:AMBER, TLP:GREEN, TLP:CLEAR.
      example: "TLP:CLEAR"
    - name: case.created_at
      type: date
      level: custom
      description: >
        Timestamp when the case was created.
      example: "1623456789000"
    - name: case.updated_at
      type: date
      level: custom
      description: >
        Timestamp when the case was last updated.
      example: "1623456789000"
    - name: case.tags
      type: keyword
      level: custom
      description: >
        Tags attached to the case for organization.
      normalize:
        - array
      example: '["tag1", "tag2", "tag3"]'
    - name: case.comments
      type: nested
      level: custom
      description: >
        Array of comments attached to the case, each authored and timestamped independently.
      normalize:
        - array
    - name: case.comments.author
      type: keyword
      level: custom
      description: >
        Name of the user that authored the comment.
      example: "admin"
    - name: case.comments.created_at
      type: date
      level: custom
      description: >
        Timestamp when the comment was created.
      example: "1623456789000"
    - name: case.comments.updated_at
      type: date
      level: custom
      description: >
        Timestamp when the comment was last updated.
      example: "1623456789000"
    - name: case.comments.comment
      type: match_only_text
      level: custom
      description: >
        Text content of the comment.
      example: "This is a comment for the case."
