---
- name: os
  reusable:
    top_level: true
    expected:
      - { at: host, as: os }
      - wazuh.agent.host
  fields:
    - name: build
      description: >
        Build number of the OS
      type: keyword
      level: custom
    - name: codename
      description: >
        OS codename
      type: keyword
      level: custom
    - name: major
      description: >
        Major version number
      type: keyword
      level: custom
    - name: minor
      description: >
        Minor version number
      type: keyword
      level: custom
    - name: patch
      description: >
        Patch level of the OS
      type: keyword
      level: custom
    - name: display_version
      description: >
        Feature update version of a Windows operating system, read from the
        registry. It holds `DisplayVersion` on releases that define it (for
        example `22H2`) and `ReleaseId` on older ones (for example `1809`).
        Empty on other operating systems.
      short: Windows feature update version, such as 22H2 or 1809.
      type: keyword
      level: custom
      example: 22H2
