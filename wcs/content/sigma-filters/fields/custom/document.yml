---
- name: document
  title: Document
  group: 1
  description: >
    Custom fields at the document level of the Sigma filter documents.
  type: group
  fields:
    - name: id
      level: custom
      type: keyword
      description: "Unique identifier of the resource."
    - name: name
      level: custom
      type: keyword
      description: "Unique name of the Sigma filter."
    - name: enabled
      level: custom
      type: boolean
      description: "Whether the resource is enabled."
    - name: metadata.title
      level: custom
      type: keyword
      description: "Title of the resource."
    - name: metadata.author
      level: custom
      type: keyword
      description: "Author of the resource."
    - name: metadata.date
      level: custom
      type: date
      description: "Date the resource was created."
    - name: metadata.modified
      level: custom
      type: date
      description: "Date the resource was last modified."
    - name: metadata.description
      level: custom
      type: text
      description: "Description of what the resource does."
    - name: metadata.references
      level: custom
      type: keyword
      description: "External references for the resource."
    - name: metadata.documentation
      level: custom
      type: keyword
      description: "Documentation for the resource."
    - name: metadata.supports
      level: custom
      type: keyword
      description: "Products or log formats the resource supports."
    - name: logsource.category
      level: custom
      type: keyword
      description: "Log source category the filter applies to."
    - name: logsource.definition
      level: custom
      type: text
      description: "Free-form description of the log source the filter expects."
    - name: logsource.product
      level: custom
      type: keyword
      description: "Product that produces the log source."
    - name: logsource.service
      level: custom
      type: keyword
      description: "Service that produces the log source."
    - name: filter.rules
      level: custom
      type: keyword
      description: "Identifiers of the rules the filter applies to."
    - name: filter.condition
      level: custom
      type: keyword
      description: "Condition of the filter, over its selections."
