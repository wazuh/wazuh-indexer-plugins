---
- name: document
  title: Document
  group: 1
  short: The searchable fields of the CTI payload.
  description: >
    The CVE record fields that are indexed. The rest of the record stays in `_source` and is not
    searchable.
  type: group
  fields:
    - name: cveMetadata
      level: custom
      type: object
      short: The metadata of the CVE record.
      description: "The metadata of the CVE record."
      parameters:
        dynamic: false
    - name: cveMetadata.cveId
      level: custom
      type: keyword
      description: "The CVE identifier."
      example: "CVE-2026-120344"
    - name: cveMetadata.state
      level: custom
      type: keyword
      description: "The publication state of the record."
      example: "PUBLISHED"
    - name: cveMetadata.assignerShortName
      level: custom
      type: keyword
      description: "The short name of the organization that assigned the CVE."
      example: "VulDB"
    - name: cveMetadata.datePublished
      level: custom
      type: date
      description: "Date the record was published."
      example: "2026-11-02T05:18:25Z"
      parameters:
        ignore_malformed: true
    - name: cveMetadata.dateUpdated
      level: custom
      type: date
      description: "Date the record was last updated."
      example: "2026-11-02T16:19:19Z"
      parameters:
        ignore_malformed: true
    - name: containers
      level: custom
      type: object
      short: The containers of the CVE record.
      description: "The containers of the CVE record."
      parameters:
        dynamic: false
    - name: containers.cna
      level: custom
      type: object
      short: The container of the CVE Numbering Authority.
      description: "The container filled by the CVE Numbering Authority that assigned the record."
      parameters:
        dynamic: false
    - name: containers.cna.metrics
      level: custom
      type: object
      short: The CNA metrics, one object per CVSS version.
      description: >
        The CNA metrics. Each CVSS version is an object named after it (`cvssV2_0`, `cvssV3_1`,
        `cvssV4_0`, ...) whose `baseScore` and `baseSeverity` are indexed by a dynamic template.
      parameters:
        dynamic: true
    - name: containers.cna.metrics.format
      level: custom
      type: keyword
      description: "The format of the metric."
      example: "CVSS"
