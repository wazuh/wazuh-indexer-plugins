---
- name: vulnerabilities
  root: true
  title: Vulnerabilities
  group: 1
  short: CTI vulnerability content documents.
  description: >
    Vulnerability content downloaded from CTI. The payload itself is stored but not indexed:
    the documents are CVE records and global maps whose shape is set by the feed, not by this
    schema, and the global maps are large dictionaries with hundreds of unique keys.
  type: group
  fields:
    - name: offset
      type: unsigned_long
      level: custom
      description: >
        The CTI offset the document was delivered at.
      example: 849527
    - name: type
      type: keyword
      level: custom
      description: >
        The type of the CTI content, for example a CVE record or one of the global maps the
        vulnerability scanner requires.
      example: "OSCPE-GLOBAL"
    - name: document
      type: object
      enabled: false
      index: false
      level: custom
      short: The CTI payload, stored verbatim and not indexed.
      description: >
        The CTI payload, stored verbatim. It is deliberately unmapped: inferring mappings from
        the payload makes the global maps unindexable, either by conflicting with a key already
        mapped as a different type or by exceeding the total field limit.
