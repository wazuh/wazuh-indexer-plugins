---
- name: base
  root: true
  title: Base
  group: 1
  description: >
    Custom fields at the root level of the policies content documents.
  type: group
  fields:
    - name: hash.sha256
      level: custom
      type: keyword
      description: "The SHA-256 hash of the resource document."
    - name: offset
      level: custom
      type: unsigned_long
      description: "The CTI offset the document was delivered at."
    - name: space.name
      level: custom
      type: keyword
      description: "Name of the space the resource belongs to."
    - name: space.hash.sha256
      level: custom
      type: keyword
      description: "The aggregate SHA-256 hash of the space's content."
    - name: user_overrides
      level: custom
      type: object
      enabled: false
      index: false
      short: User-authored overrides on top of the CTI content, stored verbatim and unindexed.
      description: >
        The user-authored overrides applied on top of the CTI content. Stored verbatim and
        deliberately not indexed, so stored filters never pollute the policies mapping.
