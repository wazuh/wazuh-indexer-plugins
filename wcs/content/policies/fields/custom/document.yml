---
- name: document
  title: Document
  group: 1
  description: >
    Custom fields at the document level of the policies content documents.
  type: group
  fields:
    - name: id
      level: custom
      type: keyword
      description: "Unique identifier of the resource."
    - name: root_decoder
      level: custom
      type: keyword
      description: "Decoder the policy uses as the root of the decoder tree."
    - name: metadata.title
      level: custom
      type: keyword
      description: "Title of the resource."
    - name: metadata.author
      level: custom
      type: keyword
      description: "Author of the resource."
    - name: metadata.date
      level: custom
      type: date
      description: "Date the resource was created."
    - name: metadata.modified
      level: custom
      type: date
      description: "Date the resource was last modified."
    - name: metadata.description
      level: custom
      type: text
      description: "Description of what the resource does."
    - name: metadata.references
      level: custom
      type: keyword
      description: "External references for the resource."
    - name: metadata.documentation
      level: custom
      type: keyword
      description: "Documentation for the resource."
    - name: metadata.compatibility
      level: custom
      type: keyword
      description: "Products or versions the resource is compatible with."
    - name: integrations
      level: custom
      type: keyword
      description: "Integrations the policy includes."
    - name: filters
      level: custom
      type: keyword
      description: "Filters the policy applies."
    - name: enrichments
      level: custom
      type: keyword
      description: "Enrichments the policy applies."
    - name: enabled
      level: custom
      type: boolean
      description: "Whether the resource is enabled."
    - name: index_unclassified_events
      level: custom
      type: boolean
      description: "Whether events the policy cannot classify are indexed."
    - name: index_discarded_events
      level: custom
      type: boolean
      description: "Whether events discarded by the policy are indexed."
