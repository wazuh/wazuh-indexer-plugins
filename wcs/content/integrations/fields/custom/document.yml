---
- name: document
  title: Document
  group: 1
  description: >
    Custom fields at the document level of the integrations content documents.
  type: group
  fields:
    - name: id
      level: custom
      type: keyword
      description: "Unique identifier of the resource."
    - name: default_parent
      level: custom
      type: keyword
      description: "Decoder used as the default parent for the integration."
    - name: category
      level: custom
      type: keyword
      description: "Category the integration belongs to."
    - name: metadata.title
      level: custom
      type: keyword
      description: "Title of the resource."
    - name: metadata.author
      level: custom
      type: keyword
      description: "Author of the resource."
    - name: metadata.date
      level: custom
      type: date
      description: "Date the resource was created."
    - name: metadata.modified
      level: custom
      type: date
      description: "Date the resource was last modified."
    - name: metadata.description
      level: custom
      type: text
      description: "Description of what the resource does."
    - name: metadata.references
      level: custom
      type: keyword
      description: "External references for the resource."
    - name: metadata.documentation
      level: custom
      type: keyword
      description: "Documentation for the resource."
    - name: metadata.supports
      level: custom
      type: keyword
      description: "Products or log formats the resource supports."
    - name: enabled
      level: custom
      type: boolean
      description: "Whether the resource is enabled."
    - name: mode
      level: custom
      type: keyword
      description: "Whether the integration is protected or user-managed."
    - name: decoders
      level: custom
      type: keyword
      description: "Decoders the integration includes."
    - name: kvdbs
      level: custom
      type: keyword
      description: "Key-value databases the integration includes."
    - name: rules
      level: custom
      type: keyword
      description: "Rules the integration includes."
    - name: detector.source
      level: custom
      type: keyword
      description: "Source the detector reads from."
    - name: detector.interval
      level: custom
      type: integer
      description: "Interval, in minutes, at which the detector runs."
    - name: detector.enabled
      level: custom
      type: boolean
      description: "Whether the integration creates a detector."
