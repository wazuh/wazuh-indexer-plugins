---
- name: document
  title: Document
  group: 1
  description: >
    Custom fields at the document level of the decoders content documents.
  type: group
  fields:
    - name: name
      level: custom
      type: keyword
      description: "Name of the resource."
    - name: enabled
      level: custom
      type: boolean
      description: "Whether the resource is enabled."
    - name: id
      level: custom
      type: keyword
      description: "Unique identifier of the resource."
    - name: metadata.title
      level: custom
      type: keyword
      description: "Title of the resource."
    - name: metadata.author
      level: custom
      type: keyword
      description: "Author of the resource."
    - name: metadata.date
      level: custom
      type: date
      description: "Date the resource was created."
    - name: metadata.modified
      level: custom
      type: date
      description: "Date the resource was last modified."
    - name: metadata.description
      level: custom
      type: text
      description: "Description of what the resource does."
    - name: metadata.references
      level: custom
      type: keyword
      description: "External references for the resource."
    - name: metadata.documentation
      level: custom
      type: keyword
      description: "Documentation for the resource."
    - name: metadata.supports
      level: custom
      type: keyword
      description: "Products or log formats the resource supports."
    - name: metadata.module
      level: custom
      type: keyword
      description: "Module the decoder belongs to."
    - name: metadata.compatibility
      level: custom
      type: keyword
      description: "Products or versions the resource is compatible with."
    - name: metadata.versions
      level: custom
      type: keyword
      description: "Versions of the supported product the decoder covers."
    - name: definitions
      level: custom
      type: object
      enabled: false
      index: false
      description: "The decoder's definitions block, stored verbatim and not indexed."
    - name: check
      level: custom
      type: object
      enabled: false
      index: false
      description: "The decoder's check stage, stored verbatim and not indexed."
    - name: parents
      level: custom
      type: keyword
      description: "Parent decoders this decoder extends."
    - name: normalize
      level: custom
      type: object
      enabled: false
      index: false
      description: "The decoder's normalize stage, stored verbatim and not indexed."
