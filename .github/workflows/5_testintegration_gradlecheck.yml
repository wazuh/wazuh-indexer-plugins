name: (5.x) Run Gradle check

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "plugins/**/*.java"
      - "plugins/**/*.gradle"
      - "gradle/coverage.gradle"
  # Runs on the default and release branches too, to keep each branch's coverage badge current.
  push:
    branches: ["main", "[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "plugins/**/*.java"
      - "plugins/**/*.gradle"
      - "gradle/coverage.gradle"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  modified-plugins:
    if: ${{ !github.event.pull_request.draft }}
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      projects: ${{ steps.detect_changes.outputs.projects || steps.all_plugins.outputs.projects }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect modified plugins
        id: detect_changes
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/5_codeanalysis_detect_modified_plugins
        with:
          base_branch: ${{ github.event.repository.default_branch }}

      # Outside a pull request the badge needs every plugin's coverage.
      - name: Select every plugin
        id: all_plugins
        if: github.event_name != 'pull_request'
        run: echo 'projects=["setup","content-manager"]' >> "$GITHUB_OUTPUT"

  branches:
    if: ${{ !github.event.pull_request.draft }}
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      common_utils_ref: ${{ steps.branches.outputs.wazuh_indexer_common_utils_branch }}
      alerting_ref: ${{ steps.branches.outputs.wazuh_indexer_alerting_branch }}
      security_analytics_ref: ${{ steps.branches.outputs.wazuh_indexer_security_analytics_branch }}
      common_utils_sha: ${{ steps.common-utils-sha.outputs.sha }}
      alerting_sha: ${{ steps.alerting-sha.outputs.sha }}
      security_analytics_sha: ${{ steps.security-analytics-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve branches
        id: branches
        uses: wazuh/wazuh-indexer/.github/actions/5_builderpackage_indexer_branch_resolver@main
        with:
          branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Get common-utils latest commit
        id: common-utils-sha
        run: |
          SHA=$(git ls-remote https://github.com/wazuh/wazuh-indexer-common-utils.git "${{ steps.branches.outputs.wazuh_indexer_common_utils_branch }}" | cut -f1 | tr -d '[:space:]')
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - name: Get alerting latest commit
        id: alerting-sha
        run: |
          SHA=$(git ls-remote https://github.com/wazuh/wazuh-indexer-alerting.git "${{ steps.branches.outputs.wazuh_indexer_alerting_branch }}" | cut -f1 | tr -d '[:space:]')
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - name: Get security-analytics latest commit
        id: security-analytics-sha
        run: |
          SHA=$(git ls-remote https://github.com/wazuh/wazuh-indexer-security-analytics.git "${{ steps.branches.outputs.wazuh_indexer_security_analytics_branch }}" | cut -f1 | tr -d '[:space:]')
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  get-version:
    if: ${{ !github.event.pull_request.draft }}
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            VERSION.json
      - name: Get version
        id: version
        run: echo "version=$(jq -r .version<VERSION.json)" >> "$GITHUB_OUTPUT"

  publish-common-utils:
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    needs: [branches, get-version]
    steps:
      - name: Restore Maven Local Cache
        id: cache-common-utils
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: m2-common-utils-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_ref }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.get-version.outputs.version }}
          restore-keys: |
            m2-common-utils-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_ref }}-${{ needs.branches.outputs.common_utils_sha }}-
      - name: Publish to Maven Local
        if: steps.cache-common-utils.outputs.cache-hit != 'true'
        uses: wazuh/wazuh-indexer-common-utils/.github/actions/5_local_maven_publisher@5.0.1
        with:
          version: ${{ needs.get-version.outputs.version }}
          revision: 0
          reference: ${{ needs.branches.outputs.common_utils_ref }}
      - name: Cache Maven Local
        if: steps.cache-common-utils.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: m2-common-utils-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_ref }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.get-version.outputs.version }}

  publish-alerting:
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    needs: [branches, get-version, publish-common-utils]
    steps:
      - name: Restore Maven Local Cache
        id: cache-alerting
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: m2-alerting-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_ref }}-${{ needs.branches.outputs.alerting_sha }}-${{ needs.get-version.outputs.version }}
          restore-keys: |
            m2-alerting-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_ref }}-${{ needs.branches.outputs.alerting_sha }}-
      - name: Restore Maven Local Cache (common-utils)
        if: steps.cache-alerting.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: m2-common-utils-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_ref }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.get-version.outputs.version }}
          restore-keys: |
            m2-common-utils-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_ref }}-${{ needs.branches.outputs.common_utils_sha }}-
      - name: Publish to Maven Local
        if: steps.cache-alerting.outputs.cache-hit != 'true'
        uses: wazuh/wazuh-indexer-alerting/.github/actions/5_local_maven_publisher@5.0.1
        with:
          version: ${{ needs.get-version.outputs.version }}
          revision: 0
          reference: ${{ needs.branches.outputs.alerting_ref }}
      - name: Cache Maven Local
        if: steps.cache-alerting.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: m2-alerting-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_ref }}-${{ needs.branches.outputs.alerting_sha }}-${{ needs.get-version.outputs.version }}

  publish-security-analytics:
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    needs: [branches, get-version, publish-common-utils, publish-alerting]
    steps:
      - name: Restore Maven Local Cache
        id: cache-sap
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: m2-sap-all-deps-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_sha }}-${{ needs.branches.outputs.security_analytics_ref }}-${{ needs.branches.outputs.security_analytics_sha }}-${{ needs.get-version.outputs.version }}
          restore-keys: |
            m2-sap-all-deps-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_sha }}-${{ needs.branches.outputs.security_analytics_ref }}-${{ needs.branches.outputs.security_analytics_sha }}-
      - name: Restore Maven Local Cache (alerting)
        if: steps.cache-sap.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: m2-alerting-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_ref }}-${{ needs.branches.outputs.alerting_sha }}-${{ needs.get-version.outputs.version }}
          restore-keys: |
            m2-alerting-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_ref }}-${{ needs.branches.outputs.alerting_sha }}-
      - name: Publish to Maven Local
        if: steps.cache-sap.outputs.cache-hit != 'true'
        uses: wazuh/wazuh-indexer-security-analytics/.github/actions/5_local_maven_publisher@5.0.1
        with:
          version: ${{ needs.get-version.outputs.version }}
          revision: 0
          reference: ${{ needs.branches.outputs.security_analytics_ref }}
      - name: Cache Maven Local
        if: steps.cache-sap.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: m2-sap-all-deps-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_sha }}-${{ needs.branches.outputs.security_analytics_ref }}-${{ needs.branches.outputs.security_analytics_sha }}-${{ needs.get-version.outputs.version }}

  gradle-check:
    needs: [modified-plugins, branches, get-version, publish-common-utils, publish-security-analytics]
    runs-on:
      - codebuild-github-actions-codebuild-runner-indexer-amd-${{ github.run_id }}-${{ github.run_attempt }}
    if: |
      always() &&
      needs.modified-plugins.result == 'success' &&
      needs.branches.result == 'success' &&
      needs.get-version.result == 'success' &&
      needs.publish-common-utils.result == 'success' &&
      needs.publish-security-analytics.result == 'success'
    strategy:
      matrix:
        project: ${{ fromJSON(needs.modified-plugins.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Maven Local Cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: m2-sap-all-deps-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_sha }}-${{ needs.branches.outputs.security_analytics_ref }}-${{ needs.branches.outputs.security_analytics_sha }}-${{ needs.get-version.outputs.version }}
          restore-keys: |
            m2-sap-all-deps-${{ github.ref_name }}-${{ needs.branches.outputs.common_utils_sha }}-${{ needs.branches.outputs.alerting_sha }}-${{ needs.branches.outputs.security_analytics_ref }}-${{ needs.branches.outputs.security_analytics_sha }}-

      - name: Run Gradle check
        working-directory: ./plugins/${{ matrix.project }}
        # The self-hosted runner executes as root, but OpenSearch test clusters
        # (launched by integTest during `check`) refuse to run as root. Run as a
        # dedicated non-root user instead.
        run: |
          id -u builder &>/dev/null || useradd -m builder
          # Hand the build user the workspace and the restored Maven local cache.
          cp -a "$HOME/.m2" /home/builder/.m2 2>/dev/null || true
          chown -R builder:builder "$GITHUB_WORKSPACE" /home/builder
          runuser -u builder -- env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" "GRADLE_USER_HOME=/home/builder/.gradle" \
            ./gradlew check jacocoTestReport -PnumNodes=1 -Dtests.coverage=true

      - name: Coverage summary
        if: ${{ !cancelled() }}
        working-directory: ./plugins/${{ matrix.project }}
        run: |
          csv=build/reports/jacoco/test/jacocoTestReport.csv
          [ -f "$csv" ] || { echo "No coverage report at $csv"; exit 0; }
          {
            echo "### Code coverage: ${{ matrix.project }}"
            echo "| Lines | Branches | Instructions |"
            echo "|---|---|---|"
            awk -F, 'NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
              END { printf "| %.1f%% | %.1f%% | %.1f%% |\n", 100*lc/(lm+lc), 100*bc/(bm+bc), 100*ic/(im+ic) }' "$csv"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.project }}
          path: plugins/${{ matrix.project }}/build/reports/jacoco/test/
          if-no-files-found: warn

  # Regenerates the pushed branch's coverage badge from its reports and stores it on the `badges`
  # branch, under a folder named after the pushed branch. The README links to the default branch's
  # badge. The `badges` branch is created on the first run.
  coverage-badge:
    needs: gradle-check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: reports

      - name: Generate badge
        uses: cicirello/jacoco-badge-generator@v2.12.1
        with:
          jacoco-csv-file: reports/coverage-content-manager/jacocoTestReport.csv reports/coverage-setup/jacocoTestReport.csv
          badges-directory: badges/${{ github.ref_name }}
          generate-branches-badge: true
          generate-coverage-endpoint: true

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: badges-branch

      - name: Commit badge
        working-directory: badges-branch
        run: |
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth 1 origin badges
            git switch -c badges FETCH_HEAD
          else
            git switch --orphan badges
          fi
          cp -r ../badges/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Badge unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update coverage badge of ${GITHUB_REF_NAME} for ${GITHUB_SHA::8}"
          # Another branch's run may have updated its own folder in the meantime.
          for _ in 1 2 3; do
            git push origin badges && exit 0
            git pull --rebase origin badges
          done
          exit 1
