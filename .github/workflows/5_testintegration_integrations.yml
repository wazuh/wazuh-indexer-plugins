name: (5.x) Test the integrations

# Tests the integrations that export the Wazuh indexer data to Elasticsearch, OpenSearch and
# Splunk (integrations/), with no external account:
#   - checks: unit tests of the events generator, and the index templates and dashboards
#     committed against what their generators build from the WCS and the dashboards code.
#   - e2e: the end-to-end test of every integration on its Docker Compose development
#     environment (integrations/tools/e2e/run.py): every index pattern scenario, no missing
#     or duplicated documents, the routing of every source, and the dashboards import.
#
# The Amazon Security Lake integration has not been adapted to the Wazuh 5.x data yet: this
# workflow does not test it, and changes to integrations/amazon-security-lake do not trigger it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "integrations/**"
      - "!integrations/amazon-security-lake/**"
      # The source of the destination index templates.
      - "plugins/setup/src/main/resources/templates/streams/events.json"
      - "plugins/setup/src/main/resources/templates/streams/findings.json"
      - ".github/workflows/5_testintegration_integrations.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: pip install -r integrations/tools/events-generator/requirements.txt -r integrations/tools/events-generator/tests/requirements.txt
      - name: Unit tests of the events generator
        working-directory: integrations/tools/events-generator
        run: python -m pytest -v
      - name: Index templates up to date with the WCS
        run: python integrations/tools/templates/generate.py --check
      - name: Dashboards up to date with their code
        run: python integrations/tools/dashboards/generate.py --check

  e2e:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        integration: [elastic, opensearch, splunk]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: pip install requests
      - name: Free disk space for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: End-to-end test of the ${{ matrix.integration }} integration
        run: python integrations/tools/e2e/run.py ${{ matrix.integration }}
